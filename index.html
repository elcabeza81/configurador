function setWho(w){ st.startWho=w; if(st.pattern&&st.pattern!=='custom') st.cycle=PATTERNS[st.pattern].gen(w); render(); }
function setPat(p){ st.pattern=p; if(p!=='custom') st.cycle=PATTERNS[p].gen(st.startWho); else if(!st.cycle) st.cycle=PATTERNS['2-2-3'].gen(st.startWho); render(); }
function toggleCyc(i){ st.cycle[i]=st.cycle[i]==='papa'?'mama':'papa'; render(); }

function showErr(m){ var e=document.getElementById('err'); if(e){ e.textContent=m; e.className='err show'; } }

function validate(){
  var s=st;
  if(s.step===1){
    if(!s.ownerName.trim()) return 'Ingresa tu nombre';
    if(!/^\d{4}$/.test(s.ownerPin)) return 'Tu PIN debe ser de 4 numeros';
    if(s.hasEx){ if(!s.exName.trim()) return 'Ingresa el nombre del otro progenitor'; if(!/^\d{4}$/.test(s.exPin)) return 'El PIN del otro debe ser de 4 numeros'; if(s.exPin===s.ownerPin) return 'Los dos PIN deben ser distintos'; }
  }
  if(s.step===2){ if(!s.startDate) return 'Elegi la fecha de inicio'; if(!s.pattern) return 'Elegi un tipo de acuerdo'; }
  if(s.step===3){ if(!s.budget||parseFloat(s.budget)<1000) return 'Ingresa un presupuesto valido'; }
  if(s.step===4&&s.hasHelper){ if(!s.helperName.trim()) return 'Ingresa el nombre de quien ayuda'; if(!s.ownerHouse.trim()) return 'Ingresa el nombre de tu casa'; if(s.shareHelper&&!s.exHouse.trim()) return 'Ingresa el nombre de la otra casa'; }
  if(s.step===6){ if(!/^[^@]+@[^@]+\.[^@]+$/.test(s.email)) return 'Ingresa un email valido'; if(!s.install) return 'Elegi como vas a instalar el backend'; }
  return null;
}

function next(){ var e=validate(); if(e){ showErr(e); return; } st.step++; render(); window.scrollTo(0,0); }
function prev(){ st.step--; render(); window.scrollTo(0,0); }

function buildPanel(){
  var clientId = (st.ownerName.toLowerCase().replace(/[^a-z0-9]/g,'') || 'cliente') + Date.now().toString(36).slice(-4);
  var cycleTs = new Date(st.startDate + 'T12:00:00').getTime();
  var ui = {
    papaName: st.startWho==='papa'? st.ownerName : (st.hasEx?st.exName:'Papa'),
    mamaName: st.startWho==='mama'? st.ownerName : (st.hasEx?st.exName:'Mama'),
    kidsTemplate: st.kidsTemplate || 'l@s chic@s',
    kidsTemplateSingular: st.kidsTemplateSingular || 'l@ chic@',
    kidsCount: st.kidsCount,
    country: st.country,
    helperName: st.helperName || '',
    ownerHouse: st.ownerHouse || '',
    exHouse: st.shareHelper ? (st.exHouse||'') : (st.ownerHouse||''),
    hasHelper: st.hasHelper
  };
  var panel = PANEL_TEMPLATE;
  panel = panel.split('__API_URL__').join('PEGAR_URL_APPS_SCRIPT_AQUI');
  panel = panel.split('__CLIENT_ID__').join(clientId);
  panel = panel.split('__PIN_OWNER__').join(st.ownerPin);
  panel = panel.split('__PIN_EX__').join(st.hasEx ? st.exPin : '0000');
  panel = panel.split('__CYCLE_START__').join(cycleTs);
  panel = panel.split('__CYCLE__').join(JSON.stringify(st.cycle));
  panel = panel.split('__PANEL_UI__').join(JSON.stringify(ui));
  panel = panel.split('__OWNER_NAME__').join(st.ownerName);
  panel = panel.split('__BUDGET__').join(parseFloat(st.budget)||300000);
  panel = panel.split('__BUDGET_TYPE__').join(st.budgetType);
  return { panel: panel, clientId: clientId };
}

function download(filename, content, type){
  var blob = new Blob([content], { type: type||'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

function finish(){
  var e=validate(); if(e){ showErr(e); return; }
  var built = buildPanel();
  // 1) descarga el panel
  download('mi-panel.html', built.panel, 'text/html;charset=utf-8');
  // 2) manda los datos por mail (a el y copia oculta a vos)
  sendMail(built.clientId);
  // 3) muestra pantalla final con instrucciones
  st.step = 7; st.clientId = built.clientId; renderFinal();
}

function sendMail(clientId){
  if (MAIL_API.indexOf('PEGAR') !== -1) return; // sin configurar todavia
  var img = new Image();
  var params = 'action=onboard' +
    '&email=' + encodeURIComponent(st.email) +
    '&name=' + encodeURIComponent(st.ownerName) +
    '&clientId=' + encodeURIComponent(clientId) +
    '&install=' + encodeURIComponent(st.install) +
    '&pattern=' + encodeURIComponent(st.pattern);
  img.src = MAIL_API + '?' + params + '&t=' + Date.now();
}

function renderFinal(){
  renderProg();
  var self = st.install === 'self';
  var h = '<div class="card"><div class="ok-icon">\u2705</div>' +
    '<div class="stitle" style="text-align:center">Tu panel se descargo</div>' +
    '<div class="ssub" style="text-align:center">Se llama <b>mi-panel.html</b> y esta en tu carpeta de descargas. Te mandamos la guia completa a <b>'+esc(st.email)+'</b>.</div>';
  if (self) {
    h += '<div class="info-box" style="text-align:left">' +
      '<b>Mientras tanto, los 3 pasos grandes:</b><br><br>' +
      '<b>1.</b> Crear tu base de datos en Google Sheets (gratis).<br>' +
      '<b>2.</b> Pegar el codigo del backend y publicarlo.<br>' +
      '<b>3.</b> Pegar la direccion que te da Google en tu panel y subirlo a internet.<br><br>' +
      'Cada paso esta explicado con capturas en el mail. No necesitas saber programar.</div>';
  } else {
    h += '<div class="info-box" style="text-align:left">Elegiste que te demos una mano. Te vamos a contactar al mail que dejaste para coordinar y dejar tu panel funcionando juntos. Guarda el archivo que se descargo, lo vamos a necesitar.</div>';
  }
  h += '<div class="nav-row"><button class="btn-next" onclick="st.step=1;st.install=\'\';render()">Empezar de nuevo</button></div></div>';
  document.getElementById('content').innerHTML = h;
  window.scrollTo(0,0);
}

st.pattern = '2-2-3';
render();
</script>
</body>
