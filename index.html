<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurador de Panel — Coparentalidad y Finanzas</title>
<link href="https://fonts.googleapis.com/css?family=Nunito:400,700,800,900" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #e6edf3; font-family: 'Nunito', sans-serif; min-height: 100vh; padding: 24px 16px; }
.container { max-width: 600px; margin: 0 auto; }

/* HEADER */
.hero { text-align: center; margin-bottom: 32px; }
.hero h1 { font-size: 28px; font-weight: 900; color: #e3b341; margin-bottom: 8px; }
.hero p { font-size: 15px; color: #7d8590; line-height: 1.6; }

/* PROGRESS */
.progress { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 28px; }
.pdot { width: 32px; height: 32px; border-radius: 50%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 13px; font-weight: 800; border: 2px solid #30363d; color: #7d8590; background: #161b22; -webkit-flex-shrink: 0; flex-shrink: 0; -webkit-transition: all 0.2s; transition: all 0.2s; }
.pdot.done { background: #e3b341; border-color: #e3b341; color: #0d1117; }
.pdot.active { background: #0d1117; border-color: #e3b341; color: #e3b341; }
.pline { -webkit-flex: 1; flex: 1; height: 2px; background: #30363d; -webkit-transition: background 0.3s; transition: background 0.3s; }
.pline.done { background: #e3b341; }

/* CARD */
.card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
.step-title { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
.step-sub { font-size: 14px; color: #7d8590; margin-bottom: 22px; line-height: 1.6; }

/* FIELDS */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #7d8590; margin-bottom: 6px; }
.field input[type="text"],
.field input[type="password"],
.field input[type="number"],
.field input[type="date"],
.field select { width: 100%; background: #21262d; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-family: 'Nunito', sans-serif; font-size: 16px; padding: 12px; -webkit-appearance: none; }
.field input:focus, .field select:focus { outline: none; border-color: #e3b341; }
.field .hint { font-size: 11px; color: #7d8590; margin-top: 5px; }
.field-row { display: -webkit-flex; display: flex; margin-bottom: 16px; }
.field-row .field { -webkit-flex: 1; flex: 1; margin-bottom: 0; margin-right: 12px; }
.field-row .field:last-child { margin-right: 0; }

/* TOGGLE */
.toggle-row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 14px 16px; background: #21262d; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 16px; }
.toggle-info .tl { font-size: 14px; font-weight: 700; }
.toggle-info .ts { font-size: 12px; color: #7d8590; margin-top: 2px; }
.toggle { position: relative; width: 48px; height: 26px; -webkit-flex-shrink: 0; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.tslider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #30363d; border-radius: 13px; -webkit-transition: .2s; transition: .2s; }
.tslider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #7d8590; border-radius: 50%; -webkit-transition: .2s; transition: .2s; }
.toggle input:checked + .tslider { background: #e3b341; }
.toggle input:checked + .tslider:before { -webkit-transform: translateX(22px); transform: translateX(22px); background: #0d1117; }

/* PATTERN CARDS */
.pattern-grid { display: -webkit-flex; display: flex; margin-bottom: 16px; }
.pattern-card { -webkit-flex: 1; flex: 1; border: 2px solid #30363d; border-radius: 10px; padding: 12px; cursor: pointer; margin-right: 8px; background: #21262d; -webkit-transition: all 0.15s; transition: all 0.15s; }
.pattern-card:last-child { margin-right: 0; }
.pattern-card.selected { border-color: #e3b341; background: rgba(227,179,65,0.08); }
.pattern-card .pc-title { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
.pattern-card .pc-desc { font-size: 11px; color: #7d8590; line-height: 1.4; }
.pattern-card.selected .pc-title { color: #e3b341; }

/* WHO BUTTONS */
.who-row { display: -webkit-flex; display: flex; margin-bottom: 16px; }
.who-btn { -webkit-flex: 1; flex: 1; padding: 14px; border: 2px solid #30363d; border-radius: 10px; cursor: pointer; text-align: center; font-size: 15px; font-weight: 800; background: #21262d; color: #7d8590; margin-right: 10px; -webkit-transition: all 0.15s; transition: all 0.15s; }
.who-btn:last-child { margin-right: 0; }
.who-btn.papa.selected { border-color: #58a6ff; background: rgba(88,166,255,0.1); color: #58a6ff; }
.who-btn.mama.selected { border-color: #f778a1; background: rgba(247,120,161,0.1); color: #f778a1; }

/* NAV BUTTONS */
.nav-row { display: -webkit-flex; display: flex; margin-top: 8px; }
.btn-back { background: none; border: 1px solid #30363d; border-radius: 8px; color: #7d8590; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; padding: 12px 20px; cursor: pointer; margin-right: 10px; }
.btn-next { -webkit-flex: 1; flex: 1; background: #e3b341; color: #0d1117; border: none; border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; padding: 12px 20px; cursor: pointer; }
.btn-next:hover { background: #d4a430; }
.btn-download { -webkit-flex: 1; flex: 1; background: #3fb950; color: #0d1117; border: none; border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; padding: 14px 20px; cursor: pointer; }
.btn-download:hover { background: #2ea041; }

/* ERROR */
.error-msg { font-size: 13px; color: #f85149; background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: none; }
.error-msg.show { display: block; }

/* SUMMARY */
.summary { background: #21262d; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.sum-row { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; padding: 10px 16px; border-bottom: 1px solid #30363d; }
.sum-row:last-child { border-bottom: none; }
.sum-key { font-size: 13px; color: #7d8590; }
.sum-val { font-size: 13px; font-weight: 700; text-align: right; }

/* SUCCESS */
.success-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
.instructions { background: #21262d; border-radius: 10px; padding: 16px; margin-top: 16px; }
.instructions ol { padding-left: 18px; }
.instructions li { font-size: 13px; color: #7d8590; margin-bottom: 8px; line-height: 1.5; }
.instructions li strong { color: #e6edf3; }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>Tu panel de coparentalidad</h1>
    <p>Configurá tu panel personalizado en 5 pasos.<br>Gratis, privado, funciona desde cualquier dispositivo.</p>
  </div>
  <div class="progress" id="progress"></div>
  <div id="step-content"></div>
</div>

<script>
var state = {
  step: 1,
  ownerName: '',
  ownerPin: '',
  hasEx: true,
  exName: '',
  exPin: '',
  cycleStartDate: '',
  cycleStartWho: 'mama',
  cyclePattern: '2-2-3',
  budget: '',
  hasHelper: false,
  helperName: '',
  ownerHouseName: '',
  exHouseName: ''
};

var PATTERNS = {
  '2-2-3': {
    title: '2-2-3 rotativo',
    desc: 'El más común. Bloques cortos y largos cada 14 días.',
    gen: function(w) {
      var o = w === 'papa' ? 'mama' : 'papa';
      return [w,w,w,o,o,w,w,o,o,o,w,w,o,o];
    }
  },
  'semanas': {
    title: 'Semanas alternadas',
    desc: 'Una semana completa con cada progenitor.',
    gen: function(w) {
      var o = w === 'papa' ? 'mama' : 'papa';
      return [w,w,w,w,w,w,w,o,o,o,o,o,o,o];
    }
  },
  '2-5': {
    title: '2 y 5 días',
    desc: 'Fin de semana corto + semana larga.',
    gen: function(w) {
      var o = w === 'papa' ? 'mama' : 'papa';
      return [w,w,o,o,o,o,o,w,w,o,o,o,o,o];
    }
  }
};

// ============================================================
// PROGRESS BAR
// ============================================================
function renderProgress() {
  var el = document.getElementById('progress');
  var html = '';
  for (var i = 1; i <= 5; i++) {
    var cls = i < state.step ? 'done' : i === state.step ? 'active' : '';
    var label = i < state.step ? '✓' : i;
    html += '<div class="pdot ' + cls + '">' + label + '</div>';
    if (i < 5) html += '<div class="pline' + (i < state.step ? ' done' : '') + '"></div>';
  }
  el.innerHTML = html;
}

// ============================================================
// STEPS
// ============================================================
function renderStep() {
  renderProgress();
  var el = document.getElementById('step-content');
  var html = '';

  if (state.step === 1) {
    html = '<div class="card">' +
      '<div class="step-title">Tu acceso</div>' +
      '<div class="step-sub">Estos datos quedan guardados solo en tu dispositivo, nadie más los ve.</div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Tu nombre</label><input type="text" id="f-name" value="' + esc(state.ownerName) + '" placeholder="Juan" oninput="state.ownerName=this.value"></div>' +
        '<div class="field"><label>Tu PIN (4 dígitos)</label><input type="password" id="f-pin" maxlength="4" value="' + esc(state.ownerPin) + '" placeholder="••••" oninput="state.ownerPin=this.value"><div class="hint">Lo usás vos para ver los montos y editar</div></div>' +
      '</div>' +
      '<div class="toggle-row"><div class="toggle-info"><div class="tl">¿El otro progenitor tiene acceso?</div><div class="ts">Ve el presupuesto en efectivo con su propio PIN</div></div>' +
        '<label class="toggle"><input type="checkbox" id="f-has-ex" ' + (state.hasEx ? 'checked' : '') + ' onchange="state.hasEx=this.checked;renderStep()"><span class="tslider"></span></label>' +
      '</div>';

    if (state.hasEx) {
      html += '<div class="field-row">' +
        '<div class="field"><label>Nombre del otro progenitor</label><input type="text" id="f-ex-name" value="' + esc(state.exName) + '" placeholder="María" oninput="state.exName=this.value"></div>' +
        '<div class="field"><label>PIN del otro progenitor</label><input type="password" id="f-ex-pin" maxlength="4" value="' + esc(state.exPin) + '" placeholder="••••" oninput="state.exPin=this.value"><div class="hint">Diferente al tuyo</div></div>' +
      '</div>';
    }
    html += '<div id="err" class="error-msg"></div><div class="nav-row"><button class="btn-next" onclick="nextStep()">Siguiente →</button></div></div>';
  }

  else if (state.step === 2) {
    var whoHtml = '<div class="who-row">' +
      '<button class="who-btn papa' + (state.cycleStartWho === 'papa' ? ' selected' : '') + '" onclick="state.cycleStartWho=\'papa\';renderStep()">👨 Papá</button>' +
      '<button class="who-btn mama' + (state.cycleStartWho === 'mama' ? ' selected' : '') + '" onclick="state.cycleStartWho=\'mama\';renderStep()">👩 Mamá</button>' +
    '</div>';

    var pHtml = '<div class="pattern-grid">';
    for (var pk in PATTERNS) {
      pHtml += '<div class="pattern-card' + (state.cyclePattern === pk ? ' selected' : '') + '" onclick="state.cyclePattern=\'' + pk + '\';renderStep()">' +
        '<div class="pc-title">' + PATTERNS[pk].title + '</div>' +
        '<div class="pc-desc">' + PATTERNS[pk].desc + '</div>' +
      '</div>';
    }
    pHtml += '</div>';

    html = '<div class="card">' +
      '<div class="step-title">El calendario de custodia</div>' +
      '<div class="step-sub">Definí desde cuándo rige el acuerdo y cómo se turnan.</div>' +
      '<div class="field"><label>¿Desde qué fecha aplica?</label><input type="date" id="f-date" value="' + esc(state.cycleStartDate) + '" onchange="state.cycleStartDate=this.value"></div>' +
      '<div class="field"><label>¿Quién tiene a los chicos ese primer día?</label></div>' +
      whoHtml +
      '<div class="field"><label>Patrón de rotación</label></div>' +
      pHtml +
      '<div id="err" class="error-msg"></div>' +
      '<div class="nav-row"><button class="btn-back" onclick="prevStep()">←</button><button class="btn-next" onclick="nextStep()">Siguiente →</button></div>' +
    '</div>';
  }

  else if (state.step === 3) {
    html = '<div class="card">' +
      '<div class="step-title">El presupuesto mensual</div>' +
      '<div class="step-sub">¿Cuánto dinero en efectivo manejás por mes para los gastos del hogar? Solo cuenta el efectivo — lo digital lo registrás aparte.</div>' +
      '<div class="field"><label>Monto en efectivo por mes</label><input type="number" id="f-budget" value="' + esc(state.budget) + '" placeholder="3000000" min="1000" step="1000" oninput="state.budget=this.value"><div class="hint">Ejemplo: 3000000 para $3.000.000 ARS</div></div>' +
      '<div id="err" class="error-msg"></div>' +
      '<div class="nav-row"><button class="btn-back" onclick="prevStep()">←</button><button class="btn-next" onclick="nextStep()">Siguiente →</button></div>' +
    '</div>';
  }

  else if (state.step === 4) {
    html = '<div class="card">' +
      '<div class="step-title">¿Tenés ayudante doméstica?</div>' +
      '<div class="step-sub">Si tenés alguien que ayuda en casa, el calendario le va a indicar a qué casa ir cada día según dónde durmieron los chicos.</div>' +
      '<div class="toggle-row"><div class="toggle-info"><div class="tl">Tengo ayudante en casa</div></div>' +
        '<label class="toggle"><input type="checkbox" id="f-has-helper" ' + (state.hasHelper ? 'checked' : '') + ' onchange="state.hasHelper=this.checked;renderStep()"><span class="tslider"></span></label>' +
      '</div>';

    if (state.hasHelper) {
      html += '<div class="field"><label>Nombre de la ayudante</label><input type="text" id="f-helper-name" value="' + esc(state.helperName) + '" placeholder="María" oninput="state.helperName=this.value"></div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Nombre de TU casa</label><input type="text" id="f-owner-house" value="' + esc(state.ownerHouseName) + '" placeholder="Prados" oninput="state.ownerHouseName=this.value"></div>' +
          '<div class="field"><label>Nombre de la casa del otro</label><input type="text" id="f-ex-house" value="' + esc(state.exHouseName) + '" placeholder="Aires" oninput="state.exHouseName=this.value"></div>' +
        '</div>';
    }

    html += '<div id="err" class="error-msg"></div>' +
      '<div class="nav-row"><button class="btn-back" onclick="prevStep()">←</button><button class="btn-next" onclick="nextStep()">Siguiente →</button></div>' +
    '</div>';
  }

  else if (state.step === 5) {
    var pname = PATTERNS[state.cyclePattern] ? PATTERNS[state.cyclePattern].title : state.cyclePattern;
    var bfmt = state.budget ? '$' + Math.round(parseFloat(state.budget)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '-';

    html = '<div class="card">' +
      '<div class="success-icon">🎉</div>' +
      '<div class="step-title" style="text-align:center">¡Todo listo, ' + esc(state.ownerName) + '!</div>' +
      '<div class="step-sub" style="text-align:center">Revisá el resumen y descargá tu panel.</div>' +
      '<div class="summary">' +
        '<div class="sum-row"><span class="sum-key">Tu nombre</span><span class="sum-val">' + esc(state.ownerName) + '</span></div>' +
        '<div class="sum-row"><span class="sum-key">PIN tuyo</span><span class="sum-val">••••</span></div>' +
        (state.hasEx
          ? '<div class="sum-row"><span class="sum-key">Acceso del otro progenitor</span><span class="sum-val">' + esc(state.exName) + ' (PIN propio)</span></div>'
          : '<div class="sum-row"><span class="sum-key">Acceso del otro progenitor</span><span class="sum-val" style="color:#7d8590">Desactivado</span></div>') +
        '<div class="sum-row"><span class="sum-key">Inicio del calendario</span><span class="sum-val">' + esc(state.cycleStartDate) + '</span></div>' +
        '<div class="sum-row"><span class="sum-key">Patrón de rotación</span><span class="sum-val">' + pname + '</span></div>' +
        '<div class="sum-row"><span class="sum-key">Presupuesto efectivo</span><span class="sum-val">' + bfmt + ' / mes</span></div>' +
        (state.hasHelper
          ? '<div class="sum-row"><span class="sum-key">Ayudante</span><span class="sum-val">' + esc(state.helperName) + ' — ' + esc(state.ownerHouseName) + ' / ' + esc(state.exHouseName) + '</span></div>'
          : '<div class="sum-row"><span class="sum-key">Ayudante</span><span class="sum-val" style="color:#7d8590">No</span></div>') +
      '</div>' +
      '<div class="instructions"><ol>' +
        '<li>Hacé click en <strong>Descargar mi panel</strong></li>' +
        '<li>Abrí el archivo <strong>mi-panel.html</strong> en cualquier navegador</li>' +
        '<li>O subilo a GitHub Pages para acceder desde cualquier dispositivo</li>' +
        '<li>El panel guarda los datos automáticamente en tu navegador</li>' +
      '</ol></div>' +
      '<div class="nav-row" style="margin-top:16px"><button class="btn-back" onclick="prevStep()">←</button><button class="btn-download" onclick="downloadPanel()">⬇ Descargar mi panel</button></div>' +
    '</div>';
  }

  el.innerHTML = html;
}

// ============================================================
// NAVIGATION
// ============================================================
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showError(msg) {
  var el = document.getElementById('err');
  if (el) { el.textContent = msg; el.className = 'error-msg show'; }
}

function validate() {
  var s = state;
  if (s.step === 1) {
    if (!s.ownerName.trim()) return 'Ingresá tu nombre';
    if (!/^\d{4}$/.test(s.ownerPin)) return 'El PIN debe tener exactamente 4 dígitos numéricos';
    if (s.hasEx) {
      if (!s.exName.trim()) return 'Ingresá el nombre del otro progenitor';
      if (!/^\d{4}$/.test(s.exPin)) return 'El PIN del otro progenitor debe tener 4 dígitos';
      if (s.exPin === s.ownerPin) return 'Los dos PINs deben ser diferentes';
    }
  }
  if (s.step === 2) {
    if (!s.cycleStartDate) return 'Elegí la fecha de inicio del acuerdo';
  }
  if (s.step === 3) {
    if (!s.budget || parseFloat(s.budget) < 1000) return 'Ingresá un presupuesto válido (mínimo 1000)';
  }
  if (s.step === 4 && s.hasHelper) {
    if (!s.helperName.trim()) return 'Ingresá el nombre de la ayudante';
    if (!s.ownerHouseName.trim()) return 'Ingresá el nombre de tu casa';
    if (!s.exHouseName.trim()) return 'Ingresá el nombre de la casa del otro progenitor';
  }
  return null;
}

function nextStep() {
  var err = validate();
  if (err) { showError(err); return; }
  state.step++;
  renderStep();
  window.scrollTo(0, 0);
}

function prevStep() {
  state.step--;
  renderStep();
  window.scrollTo(0, 0);
}

// ============================================================
// PANEL GENERATOR
// ============================================================
function downloadPanel() {
  var html = buildPanel();
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'mi-panel.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

function buildPanel() {
  var cycleTs = new Date(state.cycleStartDate + 'T12:00:00').getTime();
  var pattern = PATTERNS[state.cyclePattern] || PATTERNS['2-2-3'];
  var cycle = JSON.stringify(pattern.gen(state.cycleStartWho));
  var pinEx = state.hasEx ? state.exPin : 'DISABLED_PIN_XYZ_999';
  var hasEx = state.hasEx ? 'true' : 'false';
  var budget = parseFloat(state.budget) || 3000000;
  var hasHelper = state.hasHelper ? 'true' : 'false';
  var helperName = (state.helperName || 'Ayudante').replace(/'/g, "\\'");
  var ownerHouse = (state.ownerHouseName || 'Mi casa').replace(/'/g, "\\'");
  var exHouse = (state.exHouseName || 'Otra casa').replace(/'/g, "\\'");
  var ownerName = (state.ownerName || 'Mi panel').replace(/'/g, "\\'");

  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">\n<meta name="mobile-web-app-capable" content="yes">\n<title>Panel ' + esc(state.ownerName) + '</title>\n<link href="https://fonts.googleapis.com/css?family=Nunito:400,700,800,900" rel="stylesheet">\n' + getPanelCSS() + '\n</head>\n<body>\n' + getPanelHTML() + '\n<script>\n' + getPanelJS(state.ownerPin, pinEx, hasEx, budget, cycleTs, cycle, hasHelper, helperName, ownerHouse, exHouse) + '\n<\/script>\n</body>\n</html>';
}

function getPanelCSS() {
