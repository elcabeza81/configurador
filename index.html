.stitle { font-size: 19px; font-weight: 900; margin-bottom: 6px; }

.toggle { position: relative; width: 46px; height: 25px; flex-shrink: 0; }

.tsl { position: absolute; cursor: pointer; inset: 0; background: #30363d; border-radius: 13px; transition: .2s; }

.who-btn.mama.sel { border-color: #f778a1; background: rgba(247,120,161,0.1); color: #f778a1; }

.cyc-day { border: 1px solid #30363d; border-radius: 7px; padding: 7px 2px; text-align: center; cursor: pointer; background: #21262d; }

.cyc-day .cd-w { font-size: 14px; font-weight: 900; }
.cyc-day.papa { border-color: #58a6ff; background: rgba(88,166,255,0.12); }
.cyc-day.papa .cd-w { color: #58a6ff; }
.cyc-day.mama { border-color: #f778a1; background: rgba(247,120,161,0.12); }
.cyc-day.mama .cd-w { color: #f778a1; }

.sum-r { display: flex; justify-content: space-between; padding: 9px 15px; border-bottom: 1px solid #30363d; font-size: 13px; }
.sum-r:last-child { border-bottom: none; }
.sum-k { color: #7d8590; } .sum-v { font-weight: 700; text-align: right; }

.opt-btn.sel { border-color: #e3b341; background: rgba(227,179,65,0.08); }
.opt-btn .ot { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
.opt-btn.sel .ot { color: #e3b341; }
.opt-btn .od { font-size: 11px; color: #7d8590; line-height: 1.35; }
.ok-icon { font-size: 46px; text-align: center; margin-bottom: 10px; }
</style>
</head>

der-radius: 16px; padding: 26px 22px; width: 300px; text-align: center; }\n.mtitle { font-size: 18px; font-weight: 900; margin-bottom: 14px; }\n.minput { width: 100%; background: #21262d; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; padding: 12px; text-align: center; -webkit-appearance: none; margin-bottom: 6px; }\n.merror { font-size: 12px; color: #f85149; min-height: 18px; margin-bottom: 10px; }\n.mbtns  { display: -webkit-flex; display: flex; }\n.mbtn-c  { -webkit-flex: 1; flex: 1; background: none; border: 1px solid #30363d; border-radius: 8px; color: #7d8590; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; padding: 10px; cursor: pointer; margin-right: 8px; }\n.mbtn-ok { -webkit-flex: 1; flex: 1; background: #e3b341; color: #0d1117; border: none; border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 900; padding: 10px; cursor: pointer; }\n.empty-state { text-align: center; color: #7d8590; padding: 20px; font-size: 14px; }\n.list-item { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 11px 0; border-bottom: 1px solid #30363d; }\n.list-item:last-child { border-bottom: none; }\n.list-cb { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #30363d; cursor: pointer; margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 14px; font-weight: 900; -webkit-transition: all 0.15s; transition: all 0.15s; }\n.list-cb.done { background: #3fb950; border-color: #3fb950; color: #0d1117; }\n.list-name { -webkit-flex: 1; flex: 1; font-size: 14px; }\n.list-name.done { text-decoration: line-through; color: #7d8590; }\n.list-del { background: none; border: none; color: #7d8590; font-size: 16px; cursor: pointer; padding: 4px 6px; }\n.list-count { font-size: 11px; color: #7d8590; margin-left: 8px; }\n.cfg-row { margin-bottom: 12px; }\n.cfg-row label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #7d8590; margin-bottom: 5px; }\n.cfg-row input, .cfg-row select { width: 100%; background: #21262d; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-family: 'Nunito', sans-serif; font-size: 14px; padding: 10px; -webkit-appearance: none; }\n.share-row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 12px; background: #21262d; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 12px; }\n.share-row span { font-size: 13px; font-weight: 700; }\n.share-toggle { width: 48px; height: 26px; background: #30363d; border-radius: 13px; border: none; cursor: pointer; position: relative; }\n.share-toggle.on { background: #3fb950; }\n.share-toggle::after { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #7d8590; border-radius: 50%; -webkit-transition: .2s; transition: .2s; }\n.share-toggle.on::after { left: 25px; background: #0d1117; }\n\n@media (max-width: 520px) {\n  .hdr { -webkit-flex-wrap: wrap; flex-wrap: wrap; padding: 8px 10px; }\n  .hdr > div:first-child { -webkit-flex: 1; flex: 1; min-width: 120px; }\n  .hdr-r { width: 100%; -webkit-justify-content: flex-end; justify-content: flex-end; margin-top: 6px; }\n  .nav {\n    max-width: 100%;\n    overflow-x: auto;\n    -webkit-overflow-scrolling: touch;\n    padding-bottom: 2px;\n  }\n  .navbtn { padding: 8px 9px; font-size: 10px; letter-spacing: 0; -webkit-flex-shrink: 0; flex-shrink: 0; }\n  .eye-btn { margin-right: 6px; padding: 6px 8px; }\n  .clock { font-size: 26px; }\n  .cname { font-size: 48px; }\n  .cnext { font-size: 17px; }\n  .cnext em { font-size: 19px; }\n  .rowcards { -webkit-flex-wrap: wrap; flex-wrap: wrap; }\n  .mcard { -webkit-flex: 1 1 45%; flex: 1 1 45%; min-width: 130px; margin-bottom: 8px; }\n  .frow { -webkit-flex-wrap: wrap; flex-wrap: wrap; }\n  .frow select, .frow input[type=\"number\"] { -webkit-flex: 1 1 100%; flex: 1 1 100%; margin-right: 0; margin-bottom: 8px; }\n  .frow .addbtn { width: 100%; margin-bottom: 4px; }\n  .pay-row { -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 6px; }\n  .pay-btn {\n    -webkit-flex: 1 1 calc(33.33% - 6px); flex: 1 1 calc(33.33% - 6px);\n    min-width: 0; border-radius: 8px !important; padding: 10px 2px; font-size: 11px;\n  }\n  .cuotas-row { -webkit-flex-wrap: wrap; flex-wrap: wrap; }\n  .cuotas-row select { min-width: 0; -webkit-flex: 1; flex: 1; }\n}\n</style>\n</head>\n<body>\n\n<!-- SYNC OVERLAY (centrado, no bloquea el toque) -->\n<div id=\"sync-overlay\" style=\"display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:11000;pointer-events:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;\">\n  <div style=\"background:rgba(13,17,23,0.92);border:2px solid #e3b341;border-radius:18px;padding:26px 34px;text-align:center;-webkit-box-shadow:0 6px 30px rgba(0,0,0,0.7);box-shadow:0 6px 30px rgba(0,0,0,0.7);\">\n    <div style=\"font-size:34px;margin-bottom:8px;-webkit-animation:syncspin 1s linear infinite;animation:syncspin 1s linear infinite;display:inline-block;\">&#128260;</div>\n    <div style=\"font-size:18px;font-weight:900;color:#e3b341;letter-spacing:0.5px;\">SINCRONIZANDO</div>\n    <div style=\"font-size:13px;color:#e6edf3;margin-top:4px;\">Esper\u00e1 unos segundos<br>para ver la informaci\u00f3n actualizada</div>\n  </div>\n</div>\n<style>\n@-webkit-keyframes syncspin { from { -webkit-transform:rotate(0deg);} to { -webkit-transform:rotate(360deg);} }\n@keyframes syncspin { from { transform:rotate(0deg);} to { transform:rotate(360deg);} }\n</style>\n\n<!-- PIN MODAL -->\n<div id=\"pin-ov\" class=\"overlay\">\n  <div class=\"mbox\">\n    <div class=\"mtitle\">Ingresar PIN</div>\n    <input type=\"password\" id=\"pin-inp\" class=\"minput\" maxlength=\"4\" placeholder=\"* * * *\" style=\"letter-spacing:8px\">\n    <div id=\"pin-err\" class=\"merror\"></div>\n    <div class=\"mbtns\">\n      <button class=\"mbtn-c\" onclick=\"closePin()\">Cancelar</button>\n      <button class=\"mbtn-ok\" onclick=\"submitPin()\">OK</button>\n    </div>\n  </div>\n</div>\n\n<!-- BUDGET MODAL -->\n<div id=\"bud-ov\" class=\"overlay\">\n  <div class=\"mbox\">\n    <div class=\"mtitle\">Presupuesto efectivo mensual</div>\n    <input type=\"number\" id=\"bud-inp\" class=\"minput\" placeholder=\"3000000\" style=\"font-size:18px;letter-spacing:normal\">\n    <div class=\"merror\"></div>\n    <div class=\"mbtns\">\n      <button class=\"mbtn-c\" onclick=\"closeBud()\">Cancelar</button>\n      <button class=\"mbtn-ok\" onclick=\"saveBud()\">Guardar</button>\n    </div>\n  </div>\n</div>\n\n\n<!-- MODAL CONFIRMACI\u00d3N CALENDARIO -->\n<div id=\"cal-ov\" class=\"overlay\">\n  <div class=\"mbox\">\n    <div class=\"mtitle\" id=\"cal-modal-title\">Confirmar cambio</div>\n    <div id=\"cal-modal-desc\" style=\"font-size:13px;color:#7d8590;margin-bottom:16px;line-height:1.5\"></div>\n    <div id=\"cal-pin-section\">\n      <div style=\"font-size:12px;color:#7d8590;margin-bottom:8px\">Ingres\u00e1 tu PIN para confirmar</div>\n      <input type=\"password\" id=\"cal-pin-inp\" class=\"minput\" maxlength=\"4\" placeholder=\"* * * *\" style=\"letter-spacing:8px\">\n      <div id=\"cal-pin-err\" class=\"merror\"></div>\n    </div>\n    <div class=\"mbtns\">\n      <button class=\"mbtn-c\" onclick=\"closeCalModal()\">Cancelar</button>\n      <button class=\"mbtn-ok\" id=\"cal-confirm-btn\" onclick=\"confirmCalChange()\">Confirmar</button>\n    </div>\n  </div>\n</div>\n\n<!-- HEADER -->\n<div class=\"hdr\">\n  <div>\n    <div class=\"clock\" id=\"clock\">00:00</div>\n    <div class=\"datestr\" id=\"datestr\">cargando...</div>\n  </div>\n  <div class=\"hdr-r\">\n    <span id=\"sync-dot\" class=\"sync-dot\"></span>\n    <button id=\"eye-btn\" class=\"eye-btn\" onclick=\"handleEye()\" title=\"Ver/ocultar datos\">&#128065;</button>\n    <div class=\"nav\">\n      <button class=\"navbtn act\" onclick=\"showView('hoy')\">Hoy</button>\n      <button class=\"navbtn\"     onclick=\"showView('pres')\">$ Mes</button>\n      <button class=\"navbtn\"     onclick=\"showView('cal')\">Cal</button>\n      <button class=\"navbtn\"     onclick=\"showView('alt')\">Alertas</button>\n      <button class=\"navbtn\" id=\"nav-lista\" onclick=\"showView('lista')\">Compras</button>\n    </div>\n  </div>\n</div>\n\n<!-- HOY -->\n<div id=\"v-hoy\" class=\"view act\">\n  <div id=\"cc\" class=\"ccard ccard-n\">\n    <div class=\"clabel\" id=\"cc-label\">Hoy estan con:</div>\n    <div id=\"cc-name\" class=\"cname\">...</div>\n    <div id=\"cc-next\" class=\"cnext\"></div>\n    <div id=\"cc-helper-hoy\" class=\"cchelper-hoy\" style=\"display:none\"></div>\n  </div>\n  <div class=\"rowcards\">\n    <div class=\"mcard\">\n      <div class=\"mclabel\">Efectivo disponible</div>\n      <div class=\"mcvalue\" id=\"h-rem\" style=\"cursor:pointer;color:#7d8590\" onclick=\"handleEye()\">&#9679;&#9679;&#9679;&#9679;&#9679;</div>\n      <div class=\"mcsub\">toc\u00e1 el \ud83d\udc41 para ver</div>\n    </div>\n    <div class=\"mcard\" id=\"h-dig-card\">\n      <div class=\"mclabel\">Digital del mes</div>\n      <div class=\"mcvalue\" id=\"h-dig\" style=\"color:#7d8590\">&#9679;&#9679;&#9679;&#9679;&#9679;</div>\n      <div class=\"mcsub\">billetera + tarjeta</div>\n    </div>\n    <div class=\"mcard\">\n      <div class=\"mclabel\">Dias restantes</div>\n      <div class=\"mcvalue\" id=\"h-dias\" style=\"color:#e3b341\">...</div>\n      <div class=\"mcsub\">del mes</div>\n    </div>\n  </div>\n  <div class=\"card\">\n    <div class=\"stitle\">Ultimos gastos</div>\n    <div id=\"h-list\"></div>\n  </div>\n</div>\n\n<!-- PRESUPUESTO -->\n<div id=\"v-pres\" class=\"view\">\n  <!-- Cash budget card -->\n  <div class=\"card\">\n    <div class=\"setrow\" style=\"margin-bottom:2px\">\n      <div class=\"blabel\">Efectivo \u00b7 <span id=\"bmonth\"></span></div>\n      <button class=\"setbtn\" onclick=\"openBud()\">Editar</button>\n    </div>\n    <!-- Selector tipo de presupuesto -->\n    <div class=\"pay-row\" style=\"margin-bottom:12px\">\n      <button id=\"bt-ef\"  class=\"pay-btn act-ef\" onclick=\"setBudgetType('efectivo')\">\ud83d\udcb5 Efectivo</button>\n      <button id=\"bt-dig\" class=\"pay-btn\"        onclick=\"setBudgetType('digital')\">\ud83c\udfe6 Digital</button>\n      <button id=\"bt-all\" class=\"pay-btn\"        onclick=\"setBudgetType('todo')\">\ud83d\udd00 Todo</button>\n    </div>\n    <div class=\"brow\">\n      <div>\n        <div class=\"blabel\">Disponible</div>\n        <div class=\"bbig\" id=\"b-rem\" style=\"color:#3fb950\">&#9679;&#9679;&#9679;&#9679;&#9679;</div>\n      </div>\n      <div style=\"text-align:right\">\n        <div class=\"blabel\" id=\"b-spent-label\">Gastado</div>\n        <div class=\"bbig\" id=\"b-spent\" style=\"font-size:26px;color:#f85149\">&#9679;&#9679;&#9679;&#9679;&#9679;</div>\n      </div>\n    </div>\n    <div class=\"barbg\"><div id=\"b-bar\" class=\"barfill bargreen\" style=\"width:0%\"></div></div>\n    <div class=\"barflex\">\n      <span class=\"pctlabel\" id=\"b-pct\">bloqueado</span>\n      <span class=\"pctlabel\">Total: <span id=\"b-total\">&#9679;&#9679;&#9679;&#9679;&#9679;</span></span>\n    </div>\n  </div>\n\n  <!-- Digital summary (hidden from ex) -->\n  <div id=\"dig-row\" class=\"dig-row\" style=\"display:none\">\n    <div class=\"dig-card\">\n      <div class=\"dig-label\">Billetera</div>\n      <div class=\"dig-value\" id=\"b-bv\" style=\"color:#38bdf8\">$0</div>\n      <div class=\"dig-sub\">no descuenta efectivo</div>\n    </div>\n    <div class=\"dig-card\">\n      <div class=\"dig-label\">Tarjeta</div>\n      <div class=\"dig-value\" id=\"b-tc\" style=\"color:#8b5cf6\">$0</div>\n      <div class=\"dig-sub\">no descuenta efectivo</div>\n    </div>\n    <div class=\"dig-card\">\n      <div class=\"dig-label\">Total general</div>\n      <div class=\"dig-value\" id=\"b-all\" style=\"color:#e3b341\">$0</div>\n      <div class=\"dig-sub\">todos los medios</div>\n    </div>\n  </div>\n\n  <!-- Tarjeta de cr\u00e9dito \u2014 cuotas futuras (informativo) -->\n  <div class=\"card\" id=\"b-tc-installments\" style=\"display:none\">\n    <div class=\"stitle\" style=\"color:#8b5cf6\">&#128179; Tarjeta de cr\u00e9dito \u2014 pr\u00f3ximas cuotas</div>\n    <div style=\"font-size:11px;color:#7d8590;margin-bottom:10px\">Informativo \u2014 no descuenta del presupuesto</div>\n    <div id=\"b-tc-list\"></div>\n  </div>\n\n  <!-- Category breakdown -->\n  <div class=\"card\">\n    <div class=\"stitle\">Por categoria</div>\n    <div id=\"b-cats\"><div class=\"empty-state\">Sin gastos aun</div></div>\n  </div>\n\n  <!-- Add expense form -->\n  <div class=\"card\">\n    <div class=\"stitle\">Registrar gasto</div>\n    <div class=\"frow\">\n      <select id=\"e-cat\">\n        <option value=\"comida\">Comida</option>\n        <option value=\"servicios\">Servicios</option>\n        <option value=\"nenas\">Nenas</option>\n        <option value=\"transporte\">Transporte</option>\n        <option value=\"salud\">Salud</option>\n        <option value=\"otros\">Otros</option>\n      </select>\n      <input type=\"number\" id=\"e-amt\" placeholder=\"$ Monto\" min=\"0\" step=\"100\" oninput=\"updateCuotaPreview()\">\n      <button class=\"addbtn\" onclick=\"addExp()\">+ Agregar</button>\n    </div>\n    <div class=\"frow\"><input type=\"text\" id=\"e-desc\" placeholder=\"Descripcion (opcional)\" class=\"full-input\"></div>\n    <!-- Payment selector (hidden from ex) -->\n    <div id=\"pay-row\" class=\"pay-row\">\n      <button id=\"pay-ef\" class=\"pay-btn act-ef\" onclick=\"setPay('efectivo')\">&#128181; Efectivo</button>\n      <button id=\"pay-bv\" class=\"pay-btn\"        onclick=\"setPay('billetera')\">&#128241; Billetera</button>\n      <button id=\"pay-tc\" class=\"pay-btn\"        onclick=\"setPay('tarjeta')\">&#128179; Tarjeta</button>\n    </div>\n    <!-- Cuotas row -->\n    <div id=\"cuotas-row\" class=\"cuotas-row\" style=\"display:none\">\n      <select id=\"e-cuotas\" onchange=\"updateCuotaPreview()\">\n        <option value=\"1\">Sin cuotas</option>\n        <option value=\"2\">2 cuotas</option>\n        <option value=\"3\">3 cuotas</option>\n        <option value=\"6\">6 cuotas</option>\n        <option value=\"9\">9 cuotas</option>\n        <option value=\"12\">12 cuotas</option>\n        <option value=\"18\">18 cuotas</option>\n        <option value=\"24\">24 cuotas</option>\n      </select>\n      <span id=\"cuota-preview\" class=\"cuota-preview\"></span>\n    </div>\n  </div>\n\n  <!-- Expense list -->\n  <div class=\"card\">\n    <div class=\"setrow\">\n      <div class=\"stitle\" style=\"margin:0\">Todos los gastos del mes</div>\n      <button class=\"setbtn\" onclick=\"clearMonth()\">Limpiar mes</button>\n    </div>\n    <div id=\"b-list\"><div class=\"empty-state\">Sin gastos este mes</div></div>\n  </div>\n</div>\n\n<!-- CALENDARIO -->\n<div id=\"v-cal\" class=\"view\">\n  <div class=\"calhead\">\n    <button class=\"calnav\" onclick=\"calPrev()\">&#8592;</button>\n    <div class=\"caltitle\" id=\"cal-title\">Mayo 2026</div>\n    <button class=\"calnav\" onclick=\"calNext()\">&#8594;</button>\n  </div>\n  <div class=\"calgrid\">\n    <div class=\"caldaynames\">\n      <div class=\"caldayname\">Lun</div><div class=\"caldayname\">Mar</div><div class=\"caldayname\">Mie</div>\n      <div class=\"caldayname\">Jue</div><div class=\"caldayname\">Vie</div><div class=\"caldayname\">Sab</div><div class=\"caldayname\">Dom</div>\n    </div>\n    <div id=\"calbody\"></div>\n  </div>\n  <p class=\"cal-hint\">Toca la P o M para cambiar el turno al instante</p>\n  <div class=\"legend\">\n    <div class=\"legitem\"><div class=\"legdot ld-papa\"></div><span style=\"font-size:11px;font-weight:700;color:#58a6ff\">Papa</span></div>\n    <div class=\"legitem\"><div class=\"legdot ld-mama\"></div><span style=\"font-size:11px;font-weight:700;color:#f778a1\">Mama</span></div>\n    <div class=\"legitem\"><div class=\"legdot ld-helper\"></div><span style=\"font-size:11px;font-weight:700;color:#ff3333\">Ayudante</span></div>\n    <div class=\"legitem legitem-r\"><div class=\"legdot ld-today\"></div><span style=\"font-size:11px;font-weight:700;color:#e3b341\">Hoy</span></div>\n  </div>\n  <div style=\"display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;margin-top:10px\">\n    <button class=\"setbtn\" onclick=\"printCal()\" style=\"border-color:#e3b341;color:#e3b341\">&#128424; Imprimir para Maia</button>\n    <button class=\"setbtn\" onclick=\"resetCal()\">Restaurar calendario original</button>\n  </div>\n</div>\n\n<!-- LISTA COMPRAS -->\n<div id=\"v-lista\" class=\"view\">\n  <div class=\"card\" id=\"list-share-card\" style=\"display:none\">\n    <div class=\"share-row\">\n      <span>Compartir lista con el otro progenitor</span>\n      <button type=\"button\" id=\"share-shop-btn\" class=\"share-toggle\" onclick=\"toggleShareShopping()\" aria-label=\"Compartir lista\"></button>\n    </div>\n    <div style=\"font-size:11px;color:#7d8590\">Si esta activo, quien use el PIN del otro progenitor vera y editara la misma lista</div>\n  </div>\n  <div class=\"card\">\n    <div class=\"stitle\">Agregar a la lista</div>\n    <div class=\"frow\" style=\"margin-bottom:0\">\n      <input type=\"text\" id=\"list-inp\" placeholder=\"Ej: leche, pan, detergente...\" class=\"full-input\" style=\"margin-right:8px\">\n      <button class=\"addbtn\" onclick=\"addListItem()\">+</button>\n    </div>\n  </div>\n  <div class=\"card\">\n    <div class=\"setrow\">\n      <div class=\"stitle\" style=\"margin:0\">\n        Pendientes <span class=\"list-count\" id=\"list-pending-count\"></span>\n      </div>\n      <button class=\"setbtn\" onclick=\"clearAcquired()\">Limpiar adquiridos</button>\n    </div>\n    <div id=\"list-pending\"></div>\n  </div>\n  <div class=\"card\" id=\"list-done-card\" style=\"display:none\">\n    <div class=\"stitle\" style=\"color:#3fb950\">\n      Ya en el carrito <span class=\"list-count\" id=\"list-done-count\"></span>\n    </div>\n    <div id=\"list-done\"></div>\n  </div>\n</div>\n\n<!-- ALERTAS -->\n<div id=\"v-alt\" class=\"view\">\n  <div id=\"notif-box\" class=\"notif-box\">\n    <div style=\"font-size:13px;color:#7d8590\">Para recibir avisos en la pantalla bloqueada</div>\n    <button class=\"notif-btn\" onclick=\"reqPerms()\">Activar notificaciones</button>\n    <div id=\"notif-st\" style=\"font-size:11px;color:#7d8590;margin-top:6px\"></div>\n  </div>\n  <div class=\"card\" id=\"cfg-card\" style=\"display:none\">\n    <div class=\"stitle\">Personalizacion del panel</div>\n    <div style=\"display:-webkit-flex;display:flex;margin-bottom:12px\">\n      <div class=\"cfg-row\" style=\"-webkit-flex:1;flex:1;margin-right:8px;margin-bottom:0\">\n        <label>Nombre papa (pantalla)</label>\n        <input type=\"text\" id=\"cfg-papa\" placeholder=\"Papa\">\n      </div>\n      <div class=\"cfg-row\" style=\"-webkit-flex:1;flex:1;margin-bottom:0\">\n        <label>Nombre mama (pantalla)</label>\n        <input type=\"text\" id=\"cfg-mama\" placeholder=\"Mama\">\n      </div>\n    </div>\n    <div class=\"cfg-row\">\n      <label>Menores (plural, con @ visible: l@s chic@s)</label>\n      <input type=\"text\" id=\"cfg-kids\" placeholder=\"l@s chic@s\">\n    </div>\n    <div class=\"cfg-row\">\n      <label>Menores (singular, si es uno solo)</label>\n      <input type=\"text\" id=\"cfg-kids-sing\" placeholder=\"l@ chic@\">\n    </div>\n    <div class=\"cfg-row\">\n      <label>Cantidad de menores</label>\n      <select id=\"cfg-kids-count\">\n        <option value=\"1\">1 (singular)</option>\n        <option value=\"2\" selected>2 o mas (plural)</option>\n      </select>\n    </div>\n    <div class=\"cfg-row\">\n      <label>Pais / moneda</label>\n      <select id=\"cfg-country\"></select>\n    </div>\n    <button class=\"addbtn\" style=\"width:100%\" onclick=\"savePanelUi()\">Guardar personalizacion</button>\n  </div>\n  <div class=\"card\">\n    <div class=\"stitle\">Alertas automaticas</div>\n    <div class=\"auto-r\">\n      <div style=\"font-size:13px;font-weight:700\">Aviso de cambio de custodia</div>\n      <div style=\"font-size:11px;color:#7d8590;margin-top:2px\">Todos los dias a las 20:00 si ma\u00f1ana hay cambio</div>\n    </div>\n    <div class=\"auto-r\">\n      <div style=\"font-size:13px;font-weight:700\">Buenos dias \u2014 dia de cambio</div>\n      <div style=\"font-size:11px;color:#7d8590;margin-top:2px\">Todos los dias a las 08:00 si hoy cambia el turno</div>\n    </div>\n  </div>\n  <div class=\"card\">\n    <div class=\"stitle\">Mis recordatorios</div>\n    <div id=\"rem-list\"></div>\n  </div>\n  <div class=\"card\">\n    <div class=\"stitle\">Agregar recordatorio</div>\n    <div class=\"frow\" style=\"-webkit-align-items:center;align-items:center\">\n      <input type=\"time\" id=\"r-time\" style=\"background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-family:'Nunito',sans-serif;font-size:17px;font-weight:700;padding:10px;-webkit-appearance:none;margin-right:8px;min-width:110px\">\n      <input type=\"text\" id=\"r-msg\" placeholder=\"Mensaje del recordatorio\" class=\"full-input\" style=\"-webkit-flex:1;flex:1;margin-right:8px\">\n      <button class=\"addbtn\" onclick=\"addRem()\">+</button>\n    </div>\n  </div>\n</div>\n\n<script>\n// ============================================================\n// ** PEGAR TU URL DEL APPS SCRIPT AQUI **\n// ============================================================\nvar API_URL = '__API_URL__';\nvar USE_API = API_URL.indexOf('PEGAR') === -1;\nvar CLIENT_ID = '__CLIENT_ID__';\nvar dataLoaded = false;\n\n// \u2500\u2500 Sistema de tokens de sesi\u00f3n \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nvar SESSION_TOKEN = '';   // token en memoria, nunca en localStorage\n\nfunction setToken(token) {\n  SESSION_TOKEN = token || '';\n}\nfunction getToken() {\n  return SESSION_TOKEN;\n}\nfunction clearToken() {\n  SESSION_TOKEN = '';\n}\n// Extiende callAPI para inyectar token autom\u00e1ticamente en escrituras\nvar WRITE_ACTIONS = {\n  addExp:1, delExp:1, clearMonth:1, setBudget:1, setOverride:1,\n  resetOverrides:1, addRem:1, delRem:1, saveShopping:1,\n  setShareShop:1, setPanelUi:1, logout:1\n};\n\n\n// PIN: validacion en servidor (Apps Script initPins). Fallback = hash local sin texto plano en el HTML.\nfunction authHash(pin, role) {\n  var s = pin + '|' + role + '|pj2026', h = 0, i;\n  for (i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;\n  return (h >>> 0).toString(36);\n}\nfunction _d(a) { var s = '', i; for (i = 0; i < a.length; i++) s += String.fromCharCode(a[i] ^ 42); return s; }\nvar PIN_HASH_OWNER = authHash('__PIN_OWNER__', 'owner');\nvar PIN_HASH_EX    = authHash('__PIN_EX__', 'ex');\n\n// viewMode: 'locked' | 'full' | 'ex'\nvar viewMode   = 'locked';\nvar privTimer  = null;\nvar currentPayment = 'efectivo';\n\nvar C = {\n  expenses: [], budget: __BUDGET__, budgetType: '__BUDGET_TYPE__', overrides: {}, reminders: [],\n  shoppingList: [], shareShopping: true,\n  panelUi: __PANEL_UI__\n};\n\nvar COUNTRIES = {\n  AR: { name: 'Argentina', symbol: '$', sep: '.', decimals: 0 },\n  CL: { name: 'Chile', symbol: '$', sep: '.', decimals: 0 },\n  MX: { name: 'Mexico', symbol: '$', sep: ',', decimals: 0 },\n  CO: { name: 'Colombia', symbol: '$', sep: '.', decimals: 0 },\n  ES: { name: 'Espana', symbol: '\\u20ac', sep: '.', decimals: 0 },\n  US: { name: 'Estados Unidos', symbol: '$', sep: ',', decimals: 0 },\n  UY: { name: 'Uruguay', symbol: '$', sep: '.', decimals: 0 },\n  PE: { name: 'Peru', symbol: 'S/', sep: ',', decimals: 0 }\n};\n\nvar CYCLE_START = __CYCLE_START__;\nvar CYCLE = __CYCLE__;\nvar MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];\nvar DAYS   = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];\nvar CAT_COLORS = { comida:'#e3b341', servicios:'#38bdf8', nenas:'#f778a1', transporte:'#3fb950', salud:'#f97316', otros:'#8b5cf6' };\nvar calYear = 2026; var calMonth = 4;\n\nfunction getCatLabels() {\n  var k = kidsLabel();\n  return { comida:'Comida', servicios:'Servicios', nenas:k, transporte:'Transporte', salud:'Salud', otros:'Otros' };\n}\nfunction kidsLabel() {\n  var p = C.panelUi || {};\n  if ((+p.kidsCount || 2) === 1) {\n    return p.kidsTemplateSingular || 'l@ chic@';\n  }\n  return p.kidsTemplate || 'l@s chic@s';\n}\nfunction isHelperWorkDay(d) {\n  var dow = d.getDay();\n  return dow !== 0 && dow !== 6;\n}\nfunction whoDisplay(who) {\n  if (who === 'papa') return (C.panelUi.papaName || 'Papa').toUpperCase();\n  if (who === 'mama') return (C.panelUi.mamaName || 'Mama').toUpperCase();\n  return '';\n}\nfunction whoCalendarLabel(who) {\n  if (who === 'papa') return 'PAPA';\n  if (who === 'mama') return 'MAMA';\n  return '';\n}\nfunction custodyHoyLabel() {\n  return kidsLabel() + ' estan hoy con:';\n}\nfunction getCountry() {\n  var code = (C.panelUi && C.panelUi.country) ? C.panelUi.country : 'AR';\n  return COUNTRIES[code] || COUNTRIES.AR;\n}\n\n// ============================================================\n// ACCESS HELPERS\n// ============================================================\nfunction isLocked()  { return viewMode === 'locked'; }\nfunction isFullAccess() { return viewMode === 'full'; }\nfunction isExView()  { return viewMode === 'ex'; }\n\n// Amount formatting based on access level\nfunction fmtAmt(n) {\n  if (isLocked()) return '&#9679;&#9679;&#9679;&#9679;&#9679;';\n  return fmtMoney(n);\n}\n// Digital amounts hidden from ex\nfunction fmtDigAmt(n) {\n  if (isLocked() || isExView()) return '&#9679;&#9679;&#9679;&#9679;&#9679;';\n  return fmtMoney(n);\n}\n\n// ============================================================\n// PAYMENT METHOD\n// ============================================================\nfunction setPay(method) {\n  currentPayment = method;\n  document.getElementById('pay-ef').className = 'pay-btn' + (method === 'efectivo'  ? ' act-ef' : '');\n  document.getElementById('pay-bv').className = 'pay-btn' + (method === 'billetera' ? ' act-bv' : '');\n  document.getElementById('pay-tc').className = 'pay-btn' + (method === 'tarjeta'   ? ' act-tc' : '');\n  document.getElementById('cuotas-row').style.display = method === 'tarjeta' ? '' : 'none';\n  updateCuotaPreview();\n}\n\nfunction updateCuotaPreview() {\n  var amt    = parseFloat(document.getElementById('e-amt').value) || 0;\n  var cuotas = parseInt(document.getElementById('e-cuotas').value) || 1;\n  var el     = document.getElementById('cuota-preview');\n  if (currentPayment !== 'tarjeta') { el.innerHTML = ''; return; }\n  if (cuotas > 1 && amt > 0) {\n    el.innerHTML = cuotas + ' cuotas de ' + fmtMoney(Math.round(amt / cuotas));\n  } else if (amt > 0) {\n    el.innerHTML = 'Pago en 1 vez';\n  } else { el.innerHTML = ''; }\n}\n\n// ============================================================\n// API \u2014 JSONP\n// ============================================================\nfunction callAPI(params, cb) {\n  if (!USE_API) { if (cb) cb(null, null); return; }\n  setSyncDot('busy');\n  var n = 'apicb' + Date.now();\n  var to = setTimeout(function() { delete window[n]; setSyncDot('err'); if (cb) cb(new Error('timeout')); }, 15000);\n  window[n] = function(data) {\n    clearTimeout(to); delete window[n];\n    setSyncDot(data && !data.error ? 'ok' : 'err');\n    if (cb) cb(data && data.error ? new Error(data.error) : null, data);\n  };\n  params.callback = n;\n  // Inyectar token en acciones de escritura\n  if (params.action && WRITE_ACTIONS[params.action] && SESSION_TOKEN) {\n    params.token = SESSION_TOKEN;\n  }\n  var qs = []; for (var k in params) { if (params.hasOwnProperty(k)) qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])); }\n  var s = document.createElement('script');\n  s.src = API_URL + '?' + qs.join('&');\n  s.onerror = function() { clearTimeout(to); delete window[n]; setSyncDot('err'); if (cb) cb(new Error('network')); };\n  document.head.appendChild(s);\n}\nfunction setSyncDot(st) { document.getElementById('sync-dot').className = 'sync-dot ' + (st||''); }\n\nfunction parseShoppingList(raw) {\n  if (!raw) return [];\n  if (Array.isArray(raw)) return raw;\n  try { var a = JSON.parse(raw); return Array.isArray(a) ? a : []; } catch (x) { return []; }\n}\nfunction getLocalShopping() {\n  var sl = localStorage.getItem('shopping_list');\n  if (!sl) return [];\n  try { return JSON.parse(sl); } catch (x) { return []; }\n}\nfunction saveShoppingToServer(list, cb) {\n  if (!USE_API) { if (cb) cb(null); return; }\n  var json = JSON.stringify(list || []);\n  callAPI({ clientId: CLIENT_ID, action: 'saveShopping', list: json }, function(err, data) {\n    if (cb) cb(err, data);\n  });\n}\n\nfunction mergeShoppingFromServer(serverList) {\n  var server = parseShoppingList(serverList);\n  var local = getLocalShopping();\n  if (server.length === 0 && local.length > 0) {\n    C.shoppingList = local;\n    saveShoppingToServer(local, function(err) {\n      if (err) showBanner('Lista guardada en este dispositivo; error al subir a la nube');\n    });\n    return;\n  }\n  C.shoppingList = server;\n}\n\n// ============================================================\n// DATA\n// ============================================================\nfunction loadAll() {\n  if (!USE_API) { fromLocal(); renderAll(); updateNavAccess(); return; }\n  if (!dataLoaded) { var so = document.getElementById('sync-overlay'); if (so) so.style.display = 'flex'; }\n  var now = new Date(); var month = now.getFullYear() + '-' + pad2(now.getMonth()+1);\n  callAPI({ clientId: CLIENT_ID, action: 'getAll', month: month }, function(err, data) {\n    if (!err && data && data.expenses !== undefined) {\n      C.expenses  = data.expenses  || [];\n      C.budget     = data.budget     || 3000000;\n      C.budgetType = data.budgetType || 'efectivo';\n      C.overrides  = data.overrides  || {};\n      mergeShoppingFromServer(data.shoppingList);\n      C.shareShopping = data.shareShopping !== false;\n      if (data.panelUi) C.panelUi = mergeUi(data.panelUi);\n      var lr = getLocalRems(); var ar = data.reminders || [];\n      for (var i = 0; i < ar.length; i++) {\n        for (var j = 0; j < lr.length; j++) {\n          if (lr[j].time === ar[i].time && lr[j].msg === ar[i].msg) ar[i].lastFired = lr[j].lastFired || '';\n        }\n      }\n      C.reminders = ar; toLocal();\n    } else { fromLocal(); }\n    dataLoaded = true;\n    var so2 = document.getElementById('sync-overlay'); if (so2) so2.style.display = 'none';\n    renderAll();\n    updateNavAccess();\n    applyUiForm();\n  });\n}\nfunction mergeUi(raw) {\n  var base = C.panelUi;\n  for (var k in raw) { if (raw.hasOwnProperty(k) && raw[k] !== undefined && raw[k] !== '') base[k] = raw[k]; }\n  return base;\n}\n\nfunction fromLocal() {\n  var b  = localStorage.getItem('budget');     if (b) C.budget     = parseFloat(b);\n  var bt = localStorage.getItem('budgetType'); if (bt) C.budgetType = bt;\n  var e = localStorage.getItem(storKey());  if (e) { try { C.expenses  = JSON.parse(e); } catch(x) {} }\n  var o = localStorage.getItem('cust_ov'); if (o) { try { C.overrides = JSON.parse(o); } catch(x) {} }\n  var sl = localStorage.getItem('shopping_list'); if (sl) { try { C.shoppingList = JSON.parse(sl); } catch(x) {} }\n  var ss = localStorage.getItem('share_shopping'); if (ss !== null) C.shareShopping = ss === 'true';\n  var pu = localStorage.getItem('panel_ui'); if (pu) { try { C.panelUi = mergeUi(JSON.parse(pu)); } catch(x) {} }\n  C.reminders = getLocalRems();\n}\nfunction getLocalRems() { var r = localStorage.getItem('rems'); if (!r) return []; try { return JSON.parse(r); } catch(x) { return []; } }\nfunction toLocal() {\n  localStorage.setItem('budget',     '' + C.budget);\n  localStorage.setItem('budgetType', '' + (C.budgetType || 'efectivo'));\n  localStorage.setItem(storKey(), JSON.stringify(C.expenses));\n  localStorage.setItem('cust_ov', JSON.stringify(C.overrides));\n  localStorage.setItem('rems',    JSON.stringify(C.reminders));\n  localStorage.setItem('shopping_list', JSON.stringify(C.shoppingList || []));\n  localStorage.setItem('share_shopping', C.shareShopping ? 'true' : 'false');\n  localStorage.setItem('panel_ui', JSON.stringify(C.panelUi));\n}\nfunction renderAll() {\n  refreshCatLabels();\n  renderHoy();\n  renderBudget();\n  renderCal();\n  if (document.getElementById('v-lista').className.indexOf('act') >= 0) renderLista();\n}\n\n// ============================================================\n// EXPENSE TOTALS\n// ============================================================\nfunction totalCash() {\n  var t = 0; for (var i = 0; i < C.expenses.length; i++) { if (!C.expenses[i].payment || C.expenses[i].payment === 'efectivo') t += C.expenses[i].amt; } return t;\n}\nfunction totalBilletera() {\n  var t = 0; for (var i = 0; i < C.expenses.length; i++) { if (C.expenses[i].payment === 'billetera') t += C.expenses[i].amt; } return t;\n}\nfunction totalTarjeta() {\n  var t = 0; for (var i = 0; i < C.expenses.length; i++) { if (C.expenses[i].payment === 'tarjeta') t += C.expenses[i].amt; } return t;\n}\nfunction totalAll() { var t = 0; for (var i = 0; i < C.expenses.length; i++) t += C.expenses[i].amt; return t; }\n\n// Total que descuenta del presupuesto seg\u00fan el tipo configurado (tarjeta NUNCA descuenta)\nfunction totalBudgetable() {\n  var bt = C.budgetType || 'efectivo';\n  if (bt === 'efectivo') return totalCash();\n  if (bt === 'digital')  return totalBilletera();\n  if (bt === 'todo')     return totalCash() + totalBilletera();\n  return totalCash();\n}\n\n// Cuotas futuras de tarjeta de cr\u00e9dito \u2014 mes a mes (primer cuota = mes siguiente a la compra)\nfunction getCreditInstallments() {\n  var months = {};\n  for (var i = 0; i < C.expenses.length; i++) {\n    var e = C.expenses[i];\n    if (e.payment !== 'tarjeta') continue;\n    var cuotas = e.cuotas || 1;\n    var cuotaAmt = Math.round(e.amt / cuotas);\n    var parts = (e.date || '').split('-');\n    if (parts.length < 3) continue;\n    // Primera cuota = mes siguiente a la compra\n    var firstMonth = new Date(parseInt(parts[0]), parseInt(parts[1]), 1); // mes+1\n    for (var c = 0; c < cuotas; c++) {\n      var md = new Date(firstMonth.getFullYear(), firstMonth.getMonth() + c, 1);\n      var key = md.getFullYear() + '-' + pad2(md.getMonth() + 1);\n      months[key] = (months[key] || 0) + cuotaAmt;\n    }\n  }\n  var today = new Date();\n  var curKey = today.getFullYear() + '-' + pad2(today.getMonth() + 1);\n  var keys = Object.keys(months).sort();\n  var result = [];\n  for (var k = 0; k < keys.length; k++) {\n    var p2 = keys[k].split('-');\n    var md2 = new Date(parseInt(p2[0]), parseInt(p2[1]) - 1, 1);\n    result.push({\n      month: keys[k],\n      label: MONTHS[md2.getMonth()] + ' ' + md2.getFullYear(),\n      total: months[keys[k]],\n      isFuture: keys[k] >= curKey\n    });\n  }\n  return result;\n}\n\n// Cambiar tipo de presupuesto\nfunction setBudgetType(type) {\n  C.budgetType = type;\n  toLocal();\n  if (USE_API) callAPI({ clientId: CLIENT_ID, action: 'setBudgetType', value: type }, null);\n  renderBudget(); renderHoy();\n  // Actualizar botones\n  var types = ['efectivo','digital','todo'];\n  var ids   = ['bt-ef','bt-dig','bt-all'];\n  var cls   = ['act-ef','act-bv','act-tc'];\n  for (var i = 0; i < types.length; i++) {\n    var btn = document.getElementById(ids[i]);\n    if (btn) btn.className = 'pay-btn' + (type === types[i] ? ' ' + cls[i] : '');\n  }\n}\n\nfunction getVisibleExpenses() {\n  if (isExView()) return C.expenses.filter(function(e) { return !e.payment || e.payment === 'efectivo'; });\n  return C.expenses;\n}\n\n// ============================================================\n// CUSTODY & HELPER\n// ============================================================\nfunction getCustody(ds) {\n  if (C.overrides[ds]) return C.overrides[ds];\n  var p = ds.split('-'); var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));\n  var diff = Math.round((d.getTime() - CYCLE_START) / 86400000);\n  if (diff < 0) return null;\n  return CYCLE[((diff % 14) + 14) % 14];\n}\nfunction getHelperLocation(ds) {\n  if (!C.panelUi || !C.panelUi.hasHelper) return '';\n  var parts = ds.split('-');\n  var dayDate = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));\n  if (!isHelperWorkDay(dayDate)) return '';\n  var d = new Date(dayDate.getTime());\n  d.setDate(d.getDate() - 1);\n  var ydKey = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());\n  var who = getCustody(ydKey);\n  if (who === 'papa') return C.panelUi.ownerHouse || '';\n  if (who === 'mama') return C.panelUi.exHouse || '';\n  return '';\n}\n// D\u00eda pendiente de confirmar\nvar _pendingDay = null;\nvar _pendingWho = null;\n\nfunction toggleDay(ds) {\n  var nw = getCustody(ds) === 'papa' ? 'mama' : 'papa';\n  _pendingDay = ds;\n  _pendingWho = nw;\n  // Armar descripci\u00f3n del cambio\n  var parts = ds.split('-');\n  var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));\n  var dayName = DAYS[d.getDay()];\n  var quien = nw === 'papa' ? 'PAP\u00c1' : 'MAM\u00c1';\n  document.getElementById('cal-modal-title').innerHTML = 'Confirmar cambio';\n  document.getElementById('cal-modal-desc').innerHTML =\n    dayName + ' ' + parts[2] + '/' + parts[1] + ' \u2192 <strong style=\"color:' +\n    (nw==='papa'?'#58a6ff':'#f778a1') + '\">' + quien + '</strong>';\n  // Si ya hay sesi\u00f3n activa, no pedir PIN\n  var pinSection = document.getElementById('cal-pin-section');\n  var confirmBtn = document.getElementById('cal-confirm-btn');\n  if (!isLocked() || !USE_API) {\n    pinSection.style.display = 'none';\n    confirmBtn.innerHTML = 'Confirmar';\n  } else {\n    pinSection.style.display = '';\n    confirmBtn.innerHTML = 'Confirmar';\n    document.getElementById('cal-pin-inp').value = '';\n    document.getElementById('cal-pin-err').innerHTML = '';\n  }\n  document.getElementById('cal-ov').className = 'overlay show';\n  setTimeout(function() {\n    if (!isLocked() || !USE_API) return;\n    var i = document.getElementById('cal-pin-inp');\n    if (i) i.focus();\n  }, 100);\n}\n\nfunction closeCalModal() {\n  document.getElementById('cal-ov').className = 'overlay';\n  _pendingDay = null; _pendingWho = null;\n}\n\nfunction confirmCalChange() {\n  if (!_pendingDay) return;\n  var ds = _pendingDay; var nw = _pendingWho;\n\n  function doChange() {\n    C.overrides[ds] = nw;\n    toLocal(); renderCal();\n    if (ds === dateKey(new Date())) renderHoy();\n    closeCalModal();\n    if (USE_API) {\n      callAPI({ clientId: CLIENT_ID, action: 'setOverride', date: ds, who: nw }, function(err) {\n        if (err) showBanner('Cambio guardado localmente. Verifica tu conexion.');\n      });\n    }\n  }\n\n  // Sin sesi\u00f3n activa: validar PIN primero\n  if (isLocked() && USE_API) {\n    var v = document.getElementById('cal-pin-inp').value;\n    if (!/^\\d{4}$/.test(v)) {\n      document.getElementById('cal-pin-err').innerHTML = 'PIN de 4 d\u00edgitos';\n      return;\n    }\n    callAPI({ clientId: CLIENT_ID, action: 'validatePin', pin: v }, function(err, data) {\n      if (!err && data && data.mode) {\n        if (data.token) setToken(data.token);\n        applyViewMode(data.mode);\n        doChange();\n      } else {\n        var local = pinOkLocal(v);\n        if (local) { applyViewMode(local); doChange(); }\n        else {\n          document.getElementById('cal-pin-err').innerHTML = 'PIN incorrecto';\n          document.getElementById('cal-pin-inp').value = '';\n        }\n      }\n    });\n    return;\n  }\n  doChange();\n}\nfunction resetCal() {\n  if (!confirm('\u00bfRestaurar el calendario al esquema original? Esto borra todos los cambios manuales.')) return;\n  if (isLocked() && USE_API) {\n    var v = prompt('Ingres\u00e1 tu PIN para confirmar:');\n    if (!v) return;\n    callAPI({ clientId: CLIENT_ID, action: 'validatePin', pin: v }, function(err, data) {\n      if (!err && data && data.mode) {\n        if (data.token) setToken(data.token);\n        applyViewMode(data.mode);\n        doResetCal();\n      } else {\n        var local = pinOkLocal(v);\n        if (local) { applyViewMode(local); doResetCal(); }\n        else showBanner('PIN incorrecto');\n      }\n    });\n    return;\n  }\n  doResetCal();\n}\nfunction doResetCal() {\n  C.overrides = {};\n  if (USE_API) callAPI({ clientId: CLIENT_ID, action: 'resetOverrides' }, function() { loadAll(); });\n  else { toLocal(); renderCal(); renderHoy(); }\n}\n\n// ============================================================\n// PRIVACY / ACCESS\n// ============================================================\nfunction handleEye() {\n  if (!isLocked()) {\n    // Ocultar: cerrar sesi\u00f3n y volver a estado sin montos visibles\n    if (USE_API && getToken()) callAPI({ clientId: CLIENT_ID, action: 'logout', token: getToken() }, null);\n    clearToken();\n    viewMode = 'locked';\n    if (privTimer) clearTimeout(privTimer);\n    updLock(); renderAll(); updateAccessUI();\n  } else {\n    // Mostrar: pedir PIN\n    openPin();\n  }\n}\n// Alias por si queda alguna referencia\nfunction handleLock() { handleEye(); }\n\nfunction openPin()  { document.getElementById('pin-inp').value = ''; document.getElementById('pin-err').innerHTML = ''; document.getElementById('pin-ov').className = 'overlay show'; }\nfunction closePin() { document.getElementById('pin-ov').className = 'overlay'; }\n\nfunction applyViewMode(mode) {\n  viewMode = mode;\n  closePin(); updLock(); renderAll(); updateAccessUI(); updateNavAccess();\n  if (privTimer) clearTimeout(privTimer);\n  privTimer = setTimeout(function() {\n    if (USE_API && getToken()) callAPI({ clientId: CLIENT_ID, action: 'logout', token: getToken() }, null);\n    clearToken();\n    viewMode = 'locked'; updLock(); renderAll(); updateAccessUI(); updateNavAccess();\n  }, 120000);\n}\nfunction pinOkLocal(v) {\n  if (authHash(v, 'owner') === PIN_HASH_OWNER) return 'full';\n  if (authHash(v, 'ex') === PIN_HASH_EX) return 'ex';\n  return null;\n}\nfunction submitPin() {\n  var v = document.getElementById('pin-inp').value;\n  if (!/^\\d{4}$/.test(v)) {\n    document.getElementById('pin-err').innerHTML = 'PIN de 4 digitos';\n    return;\n  }\n  if (USE_API) {\n    callAPI({ clientId: CLIENT_ID, action: 'validatePin', pin: v }, function(err, data) {\n      if (!err && data && data.mode) {\n        if (data.token) setToken(data.token);\n        applyViewMode(data.mode);\n        return;\n      }\n      var local = pinOkLocal(v);\n      if (local) applyViewMode(local);\n      else {\n        document.getElementById('pin-err').innerHTML = (data && data.error) ? data.error : 'PIN incorrecto';\n        document.getElementById('pin-inp').value = '';\n      }\n    });\n    return;\n  }\n  var local = pinOkLocal(v);\n  if (local) applyViewMode(local);\n  else {\n    document.getElementById('pin-err').innerHTML = 'PIN incorrecto';\n    document.getElementById('pin-inp').value = '';\n  }\n}\n\nfunction updLock() {\n  var b = document.getElementById('eye-btn');\n  if (!b) return;\n  // \ud83d\udc41 cerrado = datos ocultos | \ud83d\udc41 abierto amarillo = acceso full | \ud83d\udc41 abierto azul = ex\n  if (isLocked()) {\n    b.innerHTML = '&#128065;&#65039;'; // ojo normal\n    b.className = 'eye-btn';\n    b.title = 'Tocar para ver los datos';\n  } else if (isFullAccess()) {\n    b.innerHTML = '&#128065;&#65039;'; // ojo abierto\n    b.className = 'eye-btn open';\n    b.title = 'Datos visibles \u2014 tocar para ocultar';\n  } else {\n    b.innerHTML = '&#128065;&#65039;';\n    b.className = 'eye-btn open-ex';\n    b.title = 'Vista compartida \u2014 tocar para ocultar';\n  }\n}\n\n// Show/hide digital sections based on access level\nfunction updateAccessUI() {\n  var showDigital = isFullAccess();\n  var showPay = !isExView();\n  document.getElementById('dig-row').style.display        = showDigital ? '' : 'none';\n  document.getElementById('pay-row').style.display        = showPay ? '' : 'none';\n  document.getElementById('h-dig-card').style.display     = showDigital ? '' : 'none';\n  var cfg = document.getElementById('cfg-card');\n  var lsc = document.getElementById('list-share-card');\n  if (cfg) cfg.style.display = showDigital ? '' : 'none';\n  if (lsc) lsc.style.display = showDigital ? '' : 'none';\n  if (isExView()) {\n    currentPayment = 'efectivo';\n    document.getElementById('cuotas-row').style.display = 'none';\n  }\n}\nfunction updateNavAccess() {\n  var nav = document.getElementById('nav-lista');\n  if (nav) nav.style.display = '';\n  var btn = document.getElementById('share-shop-btn');\n  if (btn) {\n    if (C.shareShopping) btn.className = 'share-toggle on';\n    else btn.className = 'share-toggle';\n  }\n}\n\n// ============================================================\n// UTILS\n// ============================================================\nfunction pad2(n)    { return n < 10 ? '0' + n : '' + n; }\nfunction dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }\nfunction fmtMoney(n) {\n  var c = getCountry();\n  var s = Math.abs(Math.round(n)).toString(); var r = '', i;\n  for (i = 0; i < s.length; i++) {\n    if (i > 0 && (s.length - i) % 3 === 0) r += c.sep;\n    r += s[i];\n  }\n  return c.symbol + r;\n}\nfunction refreshCatLabels() {\n  var labels = getCatLabels();\n  var sel = document.getElementById('e-cat');\n  if (!sel) return;\n  for (var i = 0; i < sel.options.length; i++) {\n    var v = sel.options[i].value;\n    if (labels[v]) sel.options[i].text = labels[v];\n  }\n}\nfunction storKey()  { var d = new Date(); return 'exp_' + d.getFullYear() + '_' + pad2(d.getMonth()+1); }\nfunction daysLeft() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate() - d.getDate(); }\n\n// ============================================================\n// BUDGET MODAL\n// ============================================================\nfunction openBud() { if (!isFullAccess()) { openPin(); return; } document.getElementById('bud-inp').value = C.budget; document.getElementById('bud-ov').className = 'overlay show'; }\nfunction closeBud() { document.getElementById('bud-ov').className = 'overlay'; }\nfunction saveBud() {\n  var v = parseFloat(document.getElementById('bud-inp').value);\n  if (v > 0) { C.budget = v; if (USE_API) callAPI({ clientId: CLIENT_ID, action:'setBudget', amount:v }, null); toLocal(); }\n  closeBud(); renderBudget(); renderHoy();\n}\n\n// ============================================================\n// VIEWS\n// ============================================================\nfunction showView(name) {\n  var ns = ['hoy','pres','cal','alt','lista'];\n  for (var i = 0; i < ns.length; i++) document.getElementById('v-'+ns[i]).className = 'view' + (ns[i]===name?' act':'');\n  var bs = document.querySelectorAll('.navbtn');\n  for (var j = 0; j < bs.length; j++) bs[j].className = 'navbtn' + (ns[j]===name?' act':'');\n  if (name==='hoy')  renderHoy();\n  if (name==='pres') { updateAccessUI(); renderBudget(); }\n  if (name==='cal')  renderCal();\n  if (name==='alt')  renderAlerts();\n  if (name === 'lista') renderLista();\n}\n\n// ============================================================\n// CLOCK\n// ============================================================\nfunction tick() {\n  var d = new Date();\n  document.getElementById('clock').innerHTML   = pad2(d.getHours()) + ':' + pad2(d.getMinutes());\n  document.getElementById('datestr').innerHTML = DAYS[d.getDay()] + '  ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();\n}\n\n// ============================================================\n// HOY\n// ============================================================\nfunction renderHoy() {\n  var lbl = document.getElementById('cc-label');\n  if (lbl) lbl.innerHTML = custodyHoyLabel();\n  var d = new Date(); var k = dateKey(d); var who = getCustody(k);\n  var cc = document.getElementById('cc'); var nm = document.getElementById('cc-name'); var nx = document.getElementById('cc-next');\n  if (who==='papa')      { cc.className='ccard ccard-p'; nm.className='cname cname-p'; nm.innerHTML='PAPA'; }\n  else if (who==='mama') { cc.className='ccard ccard-m'; nm.className='cname cname-m'; nm.innerHTML='MAMA'; }\n  else                   { cc.className='ccard ccard-n'; nm.className='cname'; nm.innerHTML='Sin datos'; }\n\n  var s = new Date(d); s.setDate(s.getDate()+1); var nc = null;\n  for (var i = 0; i < 90; i++) {\n    var sk = dateKey(s); var sc = getCustody(sk);\n    if (sc && sc !== who) { nc = { date: new Date(s.getTime()), who: sc }; break; }\n    s.setDate(s.getDate()+1);\n  }\n  if (nc) {\n    var diff = Math.round((nc.date.getTime()-d.getTime())/86400000);\n    var wl = whoCalendarLabel(nc.who);\n    if (diff <= 1) {\n      nx.innerHTML = 'Ma\u00f1ana pasan con <em>' + wl + '</em>';\n    } else {\n      nx.innerHTML = 'Proximo cambio en ' + diff + ' dias \u2014 ' + DAYS[nc.date.getDay()] + ' con <em>' + wl + '</em>';\n    }\n  } else nx.innerHTML = '';\n  // Donde va Maria hoy\n  var mariaHoy = getHelperLocation(k);\n  var mariaEl  = document.getElementById('cc-helper-hoy');\n  if (mariaEl) {\n    if (mariaHoy) {\n      mariaEl.innerHTML  = (C.panelUi.helperName || 'Ayudante') + ' tiene que ir a ' + mariaHoy;\n      mariaEl.style.display = '';\n    } else {\n      mariaEl.style.display = 'none';\n    }\n  }\n\n  var budget = C.budget; var spent = totalBudgetable(); var rem = budget - spent;\n  var re = document.getElementById('h-rem'); var de = document.getElementById('h-dig');\n  if (isLocked()) {\n    re.innerHTML='&#9679;&#9679;&#9679;&#9679;&#9679;'; re.style.color='#7d8590';\n    de.innerHTML='&#9679;&#9679;&#9679;&#9679;&#9679;'; de.style.color='#7d8590';\n  } else {\n    re.innerHTML=fmtMoney(rem); re.style.color=rem<budget*0.2?'#f85149':rem<budget*0.4?'#e3b341':'#3fb950';\n    if (isFullAccess()) {\n      de.innerHTML=fmtMoney(totalBilletera()+totalTarjeta()); de.style.color='#38bdf8';\n    }\n  }\n  document.getElementById('h-dias').innerHTML = daysLeft();\n\n  var exps = getVisibleExpenses();\n  var le = document.getElementById('h-list');\n  if (!exps.length) { le.innerHTML='<div class=\"empty-state\">Sin gastos registrados aun</div>'; }\n  else { var last=exps.slice(-5).reverse(); var html=''; for(var j=0;j<last.length;j++) html+=expHtml(last[j],false); le.innerHTML=html; }\n}\n\n// ============================================================\n// PRESUPUESTO\n// ============================================================\nfunction renderBudget() {\n  var CAT_LABELS = getCatLabels();\n  var d = new Date(); var budget = C.budget;\n  var spent = totalBudgetable(); var rem = budget - spent;\n  var pct = Math.min(100, Math.round(spent/budget*100)); var avail = 100-pct;\n  var bt = C.budgetType || 'efectivo';\n  var btLabel = bt === 'efectivo' ? 'efectivo' : bt === 'digital' ? 'digital' : 'total';\n\n  document.getElementById('bmonth').innerHTML  = MONTHS[d.getMonth()] + ' ' + d.getFullYear();\n  document.getElementById('b-rem').innerHTML   = fmtAmt(Math.max(0, rem));\n  document.getElementById('b-rem').style.color = isLocked()?'#7d8590':(rem<budget*0.2?'#f85149':rem<budget*0.4?'#e3b341':'#3fb950');\n  document.getElementById('b-spent').innerHTML = fmtAmt(spent);\n  document.getElementById('b-spent').style.color = isLocked()?'#7d8590':'#f85149';\n  document.getElementById('b-total').innerHTML = fmtAmt(budget);\n  document.getElementById('b-pct').innerHTML   = isLocked()?'bloqueado':(pct+'% ' + btLabel);\n  document.getElementById('b-spent-label').innerHTML = 'Gastado ' + btLabel;\n\n  // Actualizar botones de tipo de presupuesto\n  var types = ['efectivo','digital','todo'];\n  var ids   = ['bt-ef','bt-dig','bt-all'];\n  var cls   = ['act-ef','act-bv','act-tc'];\n  for (var bi = 0; bi < types.length; bi++) {\n    var btn = document.getElementById(ids[bi]);\n    if (btn) btn.className = 'pay-btn' + (bt === types[bi] ? ' ' + cls[bi] : '');\n  }\n\n  var bar = document.getElementById('b-bar');\n  if (isLocked()) { bar.style.width='0%'; bar.className='barfill bargreen'; }\n  else { bar.style.width=avail+'%'; bar.className='barfill '+(avail<20?'barred':avail<40?'baryellow':'bargreen'); }\n\n  // Secci\u00f3n digital (solo acceso full)\n  if (isFullAccess()) {\n    document.getElementById('b-bv').innerHTML  = fmtMoney(totalBilletera());\n    document.getElementById('b-tc').innerHTML  = fmtMoney(totalTarjeta());\n    document.getElementById('b-all').innerHTML = fmtMoney(totalAll());\n  }\n\n  // Bloque tarjeta de cr\u00e9dito \u2014 cuotas futuras (informativo)\n  var tcBlock = document.getElementById('b-tc-installments');\n  if (tcBlock && isFullAccess()) {\n    var installs = getCreditInstallments();\n    if (!installs.length) {\n      tcBlock.style.display = 'none';\n    } else {\n      tcBlock.style.display = '';\n      var tcHtml = '';\n      var tcTotal = 0;\n      for (var ti = 0; ti < installs.length; ti++) {\n        var inst = installs[ti];\n        tcTotal += inst.total;\n        var rowColor = inst.isFuture ? '#e6edf3' : '#7d8590';\n        tcHtml += '<div style=\"display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #30363d;font-size:13px\">';\n        tcHtml += '<span style=\"color:' + rowColor + '\">' + inst.label + '</span>';\n        tcHtml += '<span style=\"color:#8b5cf6;font-weight:700\">' + fmtMoney(inst.total) + '</span>';\n        tcHtml += '</div>';\n      }\n      tcHtml += '<div style=\"display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:900\">';\n      tcHtml += '<span style=\"color:#7d8590\">Total comprometido</span>';\n      tcHtml += '<span style=\"color:#8b5cf6\">' + fmtMoney(tcTotal) + '</span>';\n      tcHtml += '</div>';\n      document.getElementById('b-tc-list').innerHTML = tcHtml;\n    }\n  }\n\n  // Category breakdown (cash only for ex, all for full)\n  var sourceExps = getVisibleExpenses();\n  var cats = {}; for (var i = 0; i < sourceExps.length; i++) { var c = sourceExps[i].cat; cats[c]=(cats[c]||0)+sourceExps[i].amt; }\n  var ck = ['comida','servicios','nenas','transporte','salud','otros']; var ch = ''; var hc = false;\n  for (var k = 0; k < ck.length; k++) {\n    if (cats[ck[k]]) {\n      hc=true; var cp=Math.min(100,Math.round(cats[ck[k]]/budget*100)); var col=CAT_COLORS[ck[k]];\n      ch+='<div style=\"margin-bottom:10px\"><div class=\"catrow\"><span style=\"font-size:12px;font-weight:700;color:'+col+'\">'+CAT_LABELS[ck[k]]+'</span>';\n      ch+='<span style=\"font-size:12px;font-weight:700\">'+fmtAmt(cats[ck[k]])+'</span></div>';\n      ch+='<div class=\"barbg\" style=\"height:6px\"><div class=\"barfill\" style=\"width:'+(isLocked()?0:cp)+'%;background:'+col+'\"></div></div></div>';\n    }\n  }\n  document.getElementById('b-cats').innerHTML = hc?ch:'<div class=\"empty-state\">Sin gastos aun</div>';\n\n  // Expense list\n  var exps = getVisibleExpenses();\n  var le = document.getElementById('b-list');\n  if (!exps.length) { le.innerHTML='<div class=\"empty-state\">Sin gastos este mes</div>'; }\n  else { var html=''; var rev=exps.slice().reverse(); for(var j=0;j<rev.length;j++) html+=expHtml(rev[j],true); le.innerHTML=html; }\n}\n\nfunction expHtml(e, showDel) {\n  var CAT_LABELS = getCatLabels();\n  var pay    = e.payment || 'efectivo';\n  var cuotas = e.cuotas  || 1;\n  var pbadge = '';\n  if (pay === 'billetera' && isFullAccess()) pbadge = '<span class=\"pbadge pb-bv\">Digital</span>';\n  if (pay === 'tarjeta'   && isFullAccess()) pbadge = '<span class=\"pbadge pb-tc\">Tarjeta</span>';\n  var cuotaLine = '';\n  if (pay === 'tarjeta' && cuotas > 1 && isFullAccess()) {\n    cuotaLine = '<div class=\"ecuota\">' + cuotas + ' cuotas de ' + fmtMoney(Math.round(e.amt/cuotas)) + '</div>';\n  }\n  var del = showDel && e.id ? '<button class=\"edel\" onclick=\"delExp(\\''+e.id+'\\')\">&#x2715;</button>' : '';\n  return '<div class=\"eitem\">' +\n    '<span class=\"ecat bc-'+e.cat+'\">'+(CAT_LABELS[e.cat]||e.cat)+'</span>' +\n    pbadge +\n    '<div class=\"einfo\"><div class=\"edesc\">'+(e.desc||'')+'</div>'+cuotaLine+'</div>' +\n    '<span class=\"edate\">'+(e.date?e.date.substring(5):'')+'</span>' +\n    '<span class=\"eamt\">-'+fmtAmt(e.amt)+'</span>' + del + '</div>';\n}\n\nfunction addExp() {\n  var cat    = document.getElementById('e-cat').value;\n  var amt    = parseFloat(document.getElementById('e-amt').value);\n  var desc   = document.getElementById('e-desc').value;\n  var pay    = isExView() ? 'efectivo' : currentPayment;\n  var cuotas = (pay === 'tarjeta' && !isExView()) ? (parseInt(document.getElementById('e-cuotas').value)||1) : 1;\n  if (!amt || amt <= 0) { alert('Ingresa un monto valido'); return; }\n  document.getElementById('e-amt').value = ''; document.getElementById('e-desc').value = '';\n  if (isFullAccess()) { document.getElementById('e-cuotas').value = '1'; updateCuotaPreview(); }\n  var date = dateKey(new Date());\n  if (USE_API) {\n    callAPI({ clientId: CLIENT_ID, action:'addExp', cat:cat, amt:amt, desc:desc, date:date, payment:pay, cuotas:cuotas }, function(err, data) {\n      var id = (!err && data && data.id) ? data.id : 'l'+Date.now();\n      C.expenses.push({ id:id, cat:cat, amt:amt, desc:desc, date:date, payment:pay, cuotas:cuotas });\n      toLocal(); renderBudget(); renderHoy();\n    });\n  } else {\n    C.expenses.push({ id:'l'+Date.now(), cat:cat, amt:amt, desc:desc, date:date, payment:pay, cuotas:cuotas });\n    toLocal(); renderBudget(); renderHoy();\n  }\n  var payLabel = pay==='efectivo'?'efectivo':pay==='billetera'?'billetera':'tarjeta'+(cuotas>1?' '+cuotas+'c':'');\n  showBanner('Gasto registrado: '+getCatLabels()[cat]+' '+fmtMoney(amt)+' ('+payLabel+')');\n}\n\nfunction delExp(id) {\n  if (USE_API) callAPI({ clientId: CLIENT_ID, action:'delExp', id:id }, null);\n  C.expenses = C.expenses.filter(function(e) { return e.id !== id; });\n  toLocal(); renderBudget(); renderHoy();\n}\n\nfunction clearMonth() {\n  if (!confirm('Borrar todos los gastos de este mes?')) return;\n  var mkey = new Date().getFullYear() + '-' + pad2(new Date().getMonth()+1);\n  C.expenses = C.expenses.filter(function(e) { return !e.date || e.date.substring(0,7) !== mkey; });\n  if (USE_API) callAPI({ clientId: CLIENT_ID, action:'clearMonth', month:mkey }, null);\n  toLocal(); renderBudget(); renderHoy();\n}\n\n// ============================================================\n// CALENDARIO\n// ============================================================\nfunction renderCal() {\n  document.getElementById('cal-title').innerHTML = MONTHS[calMonth] + ' ' + calYear;\n  var todayK = dateKey(new Date()); var first = new Date(calYear, calMonth, 1);\n  var dow = first.getDay(); var offset = (dow===0)?6:dow-1;\n  var total = new Date(calYear, calMonth+1, 0).getDate();\n  var cells = []; for(var p=0;p<offset;p++) cells.push(null); for(var dd=1;dd<=total;dd++) cells.push(dd);\n  while (cells.length%7!==0) cells.push(null);\n  var html = '';\n  for (var r=0;r<cells.length;r+=7) {\n    html += '<div class=\"calweek\">';\n    for (var c=0;c<7;c++) {\n      var day = cells[r+c];\n      if (day===null) {\n        html += '<div class=\"calcell cc-empty\"><div class=\"ccnum\">&nbsp;</div></div>';\n      } else {\n        var dk  = calYear+'-'+pad2(calMonth+1)+'-'+pad2(day);\n        var who = getCustody(dk);\n        var loc = getHelperLocation(dk);\n        var cls = 'calcell'+(who==='papa'?' cc-papa':who==='mama'?' cc-mama':'')+(dk===todayK?' cc-today':'');\n        var wcls = who==='papa'?'ccwho w-papa':(who==='mama'?'ccwho w-mama':'ccwho');\n        var wlbl = who==='papa'?'P':(who==='mama'?'M':'\u00b7');\n        var helperHtml = loc ? '<div class=\"cchelper\">'+loc+'</div>' : '';\n        html += '<div class=\"'+cls+'\"><div class=\"ccnum\">'+day+'</div><span class=\"'+wcls+'\" onclick=\"toggleDay(\\''+dk+'\\')\">'+wlbl+'</span>'+helperHtml+'</div>';\n      }\n    }\n    html += '</div>';\n  }\n  document.getElementById('calbody').innerHTML = html;\n}\n\nfunction calPrev() { if(calMonth===0){calMonth=11;calYear--;}else calMonth--; renderCal(); }\nfunction calNext() { if(calMonth===11){calMonth=0;calYear++;}else calMonth++; renderCal(); }\n\n// ============================================================\n// IMPRESION PARA MAIA \u2014 calendario blanco y negro con tramas\n// ============================================================\nfunction printCal() {\n  var first  = new Date(calYear, calMonth, 1);\n  var dow    = first.getDay(); var offset = (dow===0)?6:dow-1;\n  var total  = new Date(calYear, calMonth+1, 0).getDate();\n  var todayK = dateKey(new Date());\n  var cells  = [];\n  for (var p=0;p<offset;p++) cells.push(null);\n  for (var dd=1;dd<=total;dd++) cells.push(dd);\n  while (cells.length%7!==0) cells.push(null);\n\n  var dayNames = ['Lun','Mar','Mie','Jue','Vie','Sab','Dom'];\n  var headRow = '<tr>';\n  for (var h=0;h<7;h++) headRow += '<th>'+dayNames[h]+'</th>';\n  headRow += '</tr>';\n\n  var rows = '';\n  for (var r=0;r<cells.length;r+=7) {\n    rows += '<tr>';\n    for (var c=0;c<7;c++) {\n      var day = cells[r+c];\n      if (day===null) { rows += '<td class=\"empty\"></td>'; continue; }\n      var dk   = calYear+'-'+pad2(calMonth+1)+'-'+pad2(day);\n      var who  = getCustody(dk);\n      var changeMark = '';\n      if (day < total) {\n        var nWho = getCustody(calYear+'-'+pad2(calMonth+1)+'-'+pad2(day+1));\n        if (who && nWho && who !== nWho) changeMark = '<div class=\"change\">&#9986; cambio</div>';\n      }\n      var cellCls = who==='papa' ? 'papa' : (who==='mama' ? 'mama' : '');\n      var label   = who==='papa' ? 'PAPA' : (who==='mama' ? 'MAMA' : '');\n      var isToday = (dk===todayK) ? ' hoy' : '';\n      rows += '<td class=\"'+cellCls+isToday+'\">' +\n                '<div class=\"dnum\">'+day+'</div>' +\n                '<div class=\"square\"></div>' +\n                '<div class=\"who\">'+label+'</div>' +\n                changeMark +\n              '</td>';\n    }\n    rows += '</tr>';\n  }\n\n  var win = window.open('', '_blank');\n  var doc = '<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Calendario ' + MONTHS[calMonth] + ' ' + calYear + '</title>';\n  doc += '<style>';\n  doc += '* { margin:0; padding:0; box-sizing:border-box; }';\n  doc += 'body { font-family: Arial, sans-serif; color:#000; padding:20px; }';\n  doc += 'h1 { text-align:center; font-size:26px; margin-bottom:4px; }';\n  doc += '.sub { text-align:center; font-size:13px; margin-bottom:18px; color:#333; }';\n  doc += 'table { width:100%; border-collapse:collapse; table-layout:fixed; }';\n  doc += 'th { border:2px solid #000; padding:8px 2px; font-size:13px; background:#000; color:#fff; text-transform:uppercase; }';\n  doc += 'td { border:2px solid #000; height:92px; vertical-align:top; padding:4px; }';\n  doc += 'td.empty { border:1px solid #bbb; }';\n  doc += '.dnum { font-size:15px; font-weight:bold; }';\n  doc += '.square { width:30px; height:30px; border:2px solid #000; margin:4px auto 2px; background:#fff; }';\n  doc += '.who { text-align:center; font-size:12px; font-weight:bold; letter-spacing:0.5px; }';\n  doc += '.change { text-align:center; font-size:9px; font-weight:bold; margin-top:1px; }';\n  doc += 'td.papa { background-image: repeating-linear-gradient(45deg, #ddd, #ddd 3px, #fff 3px, #fff 7px); }';\n  doc += 'td.mama { background-image: radial-gradient(#bbb 1.3px, #fff 1.3px); background-size: 8px 8px; }';\n  doc += 'td.hoy { outline:3px solid #000; outline-offset:-5px; }';\n  doc += '.ref { margin-top:18px; border:2px solid #000; padding:12px; }';\n  doc += '.ref h3 { font-size:14px; margin-bottom:8px; }';\n  doc += '.ref-row { display:flex; align-items:center; margin-bottom:7px; font-size:13px; }';\n  doc += '.ref-box { width:34px; height:24px; border:2px solid #000; margin-right:10px; flex-shrink:0; }';\n  doc += '.ref-box.papa { background-image: repeating-linear-gradient(45deg, #ddd, #ddd 3px, #fff 3px, #fff 7px); }';\n  doc += '.ref-box.mama { background-image: radial-gradient(#bbb 1.3px, #fff 1.3px); background-size: 8px 8px; }';\n  doc += '.note { margin-top:12px; font-size:12px; font-style:italic; text-align:center; color:#333; }';\n  doc += '@media print { body { padding:0; } .noprint { display:none; } }';\n  doc += '.noprint { text-align:center; margin-top:20px; }';\n  doc += '.noprint button { font-size:16px; padding:10px 28px; cursor:pointer; }';\n  doc += '</style></head><body>';\n  doc += '<h1>' + MONTHS[calMonth] + ' ' + calYear + '</h1>';\n  doc += '<div class=\"sub\">Mi calendario \u2014 para saber con quien estoy cada dia</div>';\n  doc += '<table>' + headRow + rows + '</table>';\n  doc += '<div class=\"ref\"><h3>Como leer mi calendario:</h3>';\n  doc += '<div class=\"ref-row\"><div class=\"ref-box papa\"></div> Dias con <b>&nbsp;PAPA&nbsp;</b> (rayado)</div>';\n  doc += '<div class=\"ref-row\"><div class=\"ref-box mama\"></div> Dias con <b>&nbsp;MAMA&nbsp;</b> (puntitos)</div>';\n  doc += '<div class=\"ref-row\">&#9986; cambio = ese dia paso con el otro</div>';\n  doc += '<div class=\"ref-row\"><div class=\"ref-box\" style=\"border-width:4px\"></div> El cuadrado grande es para tachar el dia que pasa</div>';\n  doc += '</div>';\n  doc += '<div class=\"note\">Cada noche tacha el cuadrado del dia. Asi ves cuantos faltan para el cambio.</div>';\n  doc += '<div class=\"noprint\"><button onclick=\"window.print()\">Imprimir este calendario</button></div>';\n  doc += '</body></html>';\n\n  win.document.write(doc);\n  win.document.close();\n}\n\n// ============================================================\n// ALERTAS\n// ============================================================\nfunction renderAlerts() {\n  var perm = (typeof Notification!=='undefined')?Notification.permission:'unsupported';\n  var box  = document.getElementById('notif-box');\n  if (perm==='granted') { box.style.display='none'; }\n  else if (perm==='denied') { document.getElementById('notif-st').innerHTML='Notificaciones bloqueadas. Habilitalas en la configuracion del navegador.'; }\n  else { box.style.display='block'; }\n\n  var rems = C.reminders; var le = document.getElementById('rem-list');\n  if (!rems.length) { le.innerHTML='<div class=\"empty-state\">Sin recordatorios configurados</div>'; }\n  else { var html=''; for(var i=0;i<rems.length;i++) html+='<div class=\"ritem\"><span class=\"rtime\">'+rems[i].time+'</span><span class=\"rmsg\">'+rems[i].msg+'</span><button class=\"rdel\" onclick=\"delRem('+i+')\">&#x2715;</button></div>'; le.innerHTML=html; }\n}\n\nfunction reqPerms() {\n  if (typeof Notification==='undefined') { alert('Tu navegador no soporta notificaciones nativas'); return; }\n  Notification.requestPermission(function(p) {\n    if (p==='granted') document.getElementById('notif-box').style.display='none';\n    else document.getElementById('notif-st').innerHTML='Permiso denegado.';\n  });\n}\n\nfunction addRem() {\n  var time = document.getElementById('r-time').value; var msg = document.getElementById('r-msg').value.trim();\n  if (!time||!msg) { alert('Completa la hora y el mensaje'); return; }\n  if (USE_API) { callAPI({ clientId: CLIENT_ID, action:'addRem', time:time, msg:msg }, function() { loadAll(); renderAlerts(); }); }\n  else { C.reminders.push({ time:time, msg:msg, lastFired:'' }); toLocal(); renderAlerts(); }\n  document.getElementById('r-time').value=''; document.getElementById('r-msg').value='';\n}\n\nfunction delRem(idx) {\n  if (USE_API) { callAPI({ clientId: CLIENT_ID, action:'delRem', idx:idx }, function() { loadAll(); renderAlerts(); }); return; }\n  C.reminders.splice(idx,1); toLocal(); renderAlerts();\n}\n\nfunction showBanner(msg) {\n  var el = document.createElement('div'); el.className='banner'; el.innerHTML=msg;\n  document.body.appendChild(el);\n  setTimeout(function() { if(el.parentNode) el.parentNode.removeChild(el); }, 5000);\n}\n\nfunction fireNotif(title, body) {\n  showBanner(body);\n  if (typeof Notification!=='undefined'&&Notification.permission==='granted') { try { new Notification(title,{body:body}); } catch(e) {} }\n}\n\nfunction checkRems() {\n  var now=new Date(); var time=pad2(now.getHours())+':'+pad2(now.getMinutes()); var today=dateKey(now);\n  var changed=false;\n  for (var i=0;i<C.reminders.length;i++) {\n    if (C.reminders[i].time===time&&C.reminders[i].lastFired!==today) {\n      C.reminders[i].lastFired=today; changed=true; fireNotif('Recordatorio',C.reminders[i].msg);\n    }\n  }\n  if (changed) toLocal();\n  if (time==='20:00') {\n    var tm=new Date(now); tm.setDate(tm.getDate()+1); var tdc=getCustody(today); var tmc=getCustody(dateKey(tm));\n    if (tdc&&tmc&&tdc!==tmc) fireNotif('Cambio manana','Manana '+DAYS[tm.getDay()]+' '+kidsLabel()+' pasan con '+whoCalendarLabel(tmc));\n  }\n  if (time==='08:00') {\n    var yd=new Date(now); yd.setDate(yd.getDate()-1); var ydc=getCustody(dateKey(yd)); var tdc2=getCustody(today);\n    if (ydc&&tdc2&&ydc!==tdc2) fireNotif('Buenos dias!','Hoy '+kidsLabel()+' estan con '+whoCalendarLabel(tdc2));\n  }\n}\n\ndocument.getElementById('pin-inp').onkeyup = function(e) { if((e.keyCode||e.which)===13) submitPin(); };\ndocument.getElementById('cal-pin-inp').onkeyup = function(e) { if((e.keyCode||e.which)===13) confirmCalChange(); };\ndocument.getElementById('bud-inp').onkeyup = function(e) { if((e.keyCode||e.which)===13) saveBud(); };\ndocument.getElementById('list-inp').onkeyup = function(e) { if((e.keyCode||e.which)===13) addListItem(); };\n\n// ============================================================\n// LISTA DE COMPRAS (sincronizada en Google Sheets)\n// ============================================================\nfunction persistShopping(cb) {\n  toLocal();\n  if (!USE_API) { if (cb) cb(null); return; }\n  saveShoppingToServer(C.shoppingList || [], function(err) {\n    if (err) showBanner('No se pudo guardar la lista en la nube. Reintenta.');\n    if (cb) cb(err);\n  });\n}\nfunction toggleShareShopping() {\n  if (!isFullAccess()) { openPin(); return; }\n  C.shareShopping = !C.shareShopping;\n  updateNavAccess();\n  toLocal();\n  if (USE_API) callAPI({ clientId: CLIENT_ID, action: 'setShareShop', value: C.shareShopping ? 'true' : 'false' }, null);\n  showBanner(C.shareShopping ? 'Lista compartida con el otro progenitor' : 'Lista solo para vos');\n}\n\nfunction addListItem() {\n  var inp = document.getElementById('list-inp');\n  var name = inp.value.trim();\n  if (!name) { inp.focus(); return; }\n  if (!C.shoppingList) C.shoppingList = [];\n  C.shoppingList.unshift({ id: 'li' + Date.now(), name: name, done: false });\n  inp.value = '';\n  persistShopping(function() { inp.focus(); renderLista(); });\n}\n\nfunction toggleListItem(id) {\n  for (var i = 0; i < C.shoppingList.length; i++) {\n    if (C.shoppingList[i].id === id) { C.shoppingList[i].done = !C.shoppingList[i].done; break; }\n  }\n  persistShopping(function() { renderLista(); });\n}\n\nfunction delListItem(id) {\n  C.shoppingList = (C.shoppingList || []).filter(function(it) { return it.id !== id; });\n  persistShopping(function() { renderLista(); });\n}\n\nfunction clearAcquired() {\n  if (!confirm('Limpiar todos los items adquiridos?')) return;\n  C.shoppingList = (C.shoppingList || []).filter(function(it) { return !it.done; });\n  persistShopping(function() { renderLista(); });\n}\n\nfunction listItemHtml(item) {\n  var cbCls  = 'list-cb' + (item.done ? ' done' : '');\n  var nameCls = 'list-name' + (item.done ? ' done' : '');\n  var check  = item.done ? '&#10003;' : '';\n  return '<div class=\"list-item\">' +\n    '<div class=\"' + cbCls + '\" onclick=\"toggleListItem(\\'' + item.id + '\\')\">' + check + '</div>' +\n    '<span class=\"' + nameCls + '\">' + item.name + '</span>' +\n    '<button class=\"list-del\" onclick=\"delListItem(\\'' + item.id + '\\')\">&#x2715;</button>' +\n  '</div>';\n}\n\nfunction renderLista() {\n  var list    = C.shoppingList || [];\n  var pending = list.filter(function(i) { return !i.done; });\n  var done    = list.filter(function(i) { return i.done; });\n\n  var pEl = document.getElementById('list-pending');\n  var dEl = document.getElementById('list-done');\n  var dCard = document.getElementById('list-done-card');\n  var pCount = document.getElementById('list-pending-count');\n  var dCount = document.getElementById('list-done-count');\n\n  if (pCount) pCount.innerHTML = pending.length ? '(' + pending.length + ')' : '';\n  if (dCount) dCount.innerHTML = done.length ? '(' + done.length + ')' : '';\n\n  pEl.innerHTML = pending.length\n    ? (function() { var h = ''; for (var i = 0; i < pending.length; i++) h += listItemHtml(pending[i]); return h; })()\n    : '<div class=\"empty-state\">Lista vacia \u2014 agrega el primer item arriba</div>';\n\n  dCard.style.display = done.length ? '' : 'none';\n  dEl.innerHTML = (function() { var h = ''; for (var i = 0; i < done.length; i++) h += listItemHtml(done[i]); return h; })();\n}\n// ============================================================\n// PERSONALIZACION / PAIS\n// ============================================================\nfunction fillCountrySelect() {\n  var sel = document.getElementById('cfg-country');\n  if (!sel || sel.options.length) return;\n  var html = '', code;\n  for (code in COUNTRIES) {\n    if (COUNTRIES.hasOwnProperty(code)) {\n      html += '<option value=\"' + code + '\">' + COUNTRIES[code].name + '</option>';\n    }\n  }\n  sel.innerHTML = html;\n}\nfunction applyUiForm() {\n  fillCountrySelect();\n  var p = C.panelUi;\n  var el;\n  el = document.getElementById('cfg-papa'); if (el) el.value = p.papaName || '';\n  el = document.getElementById('cfg-mama'); if (el) el.value = p.mamaName || '';\n  el = document.getElementById('cfg-kids'); if (el) el.value = p.kidsTemplate || '';\n  el = document.getElementById('cfg-kids-sing'); if (el) el.value = p.kidsTemplateSingular || '';\n  el = document.getElementById('cfg-kids-count'); if (el) el.value = '' + (p.kidsCount || 2);\n  el = document.getElementById('cfg-country'); if (el) el.value = p.country || 'AR';\n}\nfunction savePanelUi() {\n  if (!isFullAccess()) { openPin(); return; }\n  C.panelUi.papaName = (document.getElementById('cfg-papa').value || 'Papa').trim();\n  C.panelUi.mamaName = (document.getElementById('cfg-mama').value || 'Mama').trim();\n  C.panelUi.kidsTemplate = (document.getElementById('cfg-kids').value || 'l@s chic@s').trim();\n  C.panelUi.kidsTemplateSingular = (document.getElementById('cfg-kids-sing').value || 'l@ chic@').trim();\n  C.panelUi.kidsCount = parseInt(document.getElementById('cfg-kids-count').value, 10) || 2;\n  C.panelUi.country = document.getElementById('cfg-country').value || 'AR';\n  toLocal();\n  if (USE_API) {\n    callAPI({\n      clientId: CLIENT_ID,\n      action: 'setPanelUi',\n      papaName: C.panelUi.papaName,\n      mamaName: C.panelUi.mamaName,\n      kidsTemplate: C.panelUi.kidsTemplate,\n      kidsTemplateSingular: C.panelUi.kidsTemplateSingular,\n      kidsCount: C.panelUi.kidsCount,\n      country: C.panelUi.country,\n      helperName: C.panelUi.helperName,\n      ownerHouse: C.panelUi.ownerHouse,\n      exHouse: C.panelUi.exHouse,\n      hasHelper: C.panelUi.hasHelper ? 'true' : 'false'\n    }, function(err, data) {\n      if (err || (data && data.error)) {\n        showBanner('Error al guardar. Verific\u00e1 tu conexi\u00f3n.');\n      } else {\n        loadAll();\n        showBanner('Personalizacion guardada \u2713');\n      }\n    });\n  } else {\n    renderAll();\n    showBanner('Personalizacion guardada \u2713');\n  }\n}\n\n// ============================================================\n// INIT\n// ============================================================\nvar _n = new Date();\ncalYear  = _n.getFullYear() >= 2026 ? _n.getFullYear() : 2026;\ncalMonth = _n.getFullYear() === 2026 ? _n.getMonth() : 4;\n\nfillCountrySelect();\napplyUiForm();\ntick();\nsetInterval(tick, 1000);\nloadAll();\nsetInterval(loadAll, 120000);\nsetInterval(checkRems, 60000);\n<\/script>\n</body>\n</html>";
